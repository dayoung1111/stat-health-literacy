<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<style>
/* 디자인 시안: 위내시경 수업 (예시) — Gastro.dc.html. 수업 화면 좌표는 시안의 896×504 그대로 쓴다. */
[hidden]{display:none!important}
/* 앱이 고른 언어의 글자를 보내 줄 때까지는 비워 둔다(한국어가 잠깐 보였다 바뀌는 것을 막는다) */
body.wait .wrap{visibility:hidden}
*{box-sizing:border-box}
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --fg:#15262B; --muted:#4A5D63; --line:#CAD6D6;
  --teal:#0F6670; --teal-dark:#0B4E56; --mint:#DCEDEE;
  --font:Arial,Helvetica,sans-serif; /* 앱 본문(globals.css)과 같은 글꼴. 인터넷을 안 써서 막혀도 같게 보인다 */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A1D; --surface:#16262A; --fg:#E7F0F1; --muted:#9DB2B5; --line:#2A3E43; --mint:#1F3A3E; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1A1D; --surface:#16262A; --fg:#E7F0F1; --muted:#9DB2B5; --line:#2A3E43; --mint:#1F3A3E; color-scheme:dark}

body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.embed body{padding-block:4px 8px}
/* 앱이 액자 높이를 내용에 맞추므로 액자 안에서는 스크롤 막대를 두지 않는다 */
.embed{overflow:hidden}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
header h1{font-size:1.4rem;font-weight:700;margin:0}
.crumb{font-size:.95rem;color:var(--muted)}
.sample{margin-left:auto;font-size:.82rem;font-weight:700;color:#7A5A06;background:#FFF1C7;padding:6px 12px;border-radius:999px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr);gap:18px}}

/* ===== 수업 화면 (항상 밝은 화면). 1u = 시안의 1px ===== */
.player{display:flex;flex-direction:column;gap:14px;min-width:0}
.screen{position:relative;container-type:inline-size;border-radius:18px;overflow:hidden;background:#EAF2F0;color:#15262B}
.screen{--u:calc(100cqw / 896)}
.scene{display:block;width:100%;height:auto;aspect-ratio:896/504}
.scene text{font-family:var(--font)}

.ttobak{position:absolute;right:calc(var(--u) * 36);top:calc(var(--u) * 187);width:calc(var(--u) * 230);height:calc(var(--u) * 219);transform:scaleX(-1)}
.ttobak .pose,.ttobak .face{display:none}
.ttobak[data-pose="wave"] .p-wave,.ttobak[data-pose="point"] .p-point,.ttobak[data-pose="cheer"] .p-cheer{display:inline}
.ttobak[data-pose="cheer"] .f-cheer,.ttobak:not([data-pose="cheer"]) .f-normal{display:inline}
.ttobak .arm{transform-box:view-box}
.ttobak[data-pose="wave"] .arm{transform-origin:150px 116px}
.ttobak[data-pose="point"] .arm{transform-origin:150px 118px}
.ttobak .talk{opacity:0}
.playing .ttobak .bob{animation:lcBob 1.8s ease-in-out infinite}
.cheering .ttobak .bob{animation:lcBob 1.8s ease-in-out infinite}
.playing.moving .ttobak[data-pose="wave"] .arm{animation:lcWave .9s ease-in-out infinite}
.playing.moving .ttobak[data-pose="point"] .arm{animation:lcPoint 1.4s ease-in-out infinite}
.playing .ttobak .talk{animation:lcTalk .32s steps(1,end) infinite}

/* 자막 말풍선 */
.bubble{position:absolute;left:calc(var(--u) * 20);right:calc(var(--u) * 20);bottom:calc(var(--u) * 16);min-height:calc(var(--u) * 78);
  background:#FFFFFF;border:calc(var(--u) * 3) solid #15262B;border-radius:calc(var(--u) * 20);padding:calc(var(--u) * 12) calc(var(--u) * 22);
  display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u) * 16)}
.bubble::before{content:"";position:absolute;top:calc(var(--u) * -13);right:calc(var(--u) * 150);width:calc(var(--u) * 22);height:calc(var(--u) * 22);
  background:#FFFFFF;border-left:calc(var(--u) * 3) solid #15262B;border-top:calc(var(--u) * 3) solid #15262B;transform:rotate(45deg)}
.say{font-size:calc(var(--u) * 25);font-weight:700;line-height:1.4;word-break:keep-all}
.say mark{border-radius:calc(var(--u) * 8);padding:0 calc(var(--u) * 6)}
.say mark.r{background:#FCE3E1;color:#A3262C}
.say mark.g{background:#DDF3E8;color:#1D6E47}
.say mark.y{background:#FFF1C7;color:#7A5A06}
.acts{display:flex;gap:calc(var(--u) * 10);flex:none}
.opt{min-width:calc(var(--u) * 150);height:calc(var(--u) * 54);border-radius:calc(var(--u) * 14);border:calc(var(--u) * 2.5) solid #15262B;
  background:#FFFFFF;color:#15262B;font-size:calc(var(--u) * 19);font-weight:700;padding:0 calc(var(--u) * 12)}
.opt.wrong{background:#FCE3E1}
.again{height:calc(var(--u) * 54);border-radius:calc(var(--u) * 14);border:none;background:#0F6670;color:#FFFFFF;
  font-size:calc(var(--u) * 18);font-weight:700;padding:0 calc(var(--u) * 20)}

/* 휴대폰처럼 좁으면 글씨가 너무 작아지므로 말풍선을 그림 아래로 내리고 글씨 크기를 고정한다 */
@container (max-width:640px){
  .bubble{position:relative;left:auto;right:auto;bottom:auto;margin:0 10px 10px;min-height:0;border-width:3px;border-radius:16px;
    padding:12px 14px;flex-direction:column;align-items:stretch;gap:10px}
  .bubble::before{top:-13px;right:22%;width:20px;height:20px;border-left-width:3px;border-top-width:3px}
  .say{font-size:20px}
  .say mark{border-radius:6px;padding:0 4px}
  .acts{gap:8px}
  .opt,.again{flex:1;min-width:0;height:auto;min-height:54px;padding:8px 10px;line-height:1.2;border-radius:14px;border-width:2.5px;font-size:18px}
  .fresh .bubble{visibility:hidden}
}

/* 시작 전에는 뒤의 번호 카드를 숨긴다("눌러서 수업 시작" 글자와 겹치지 않게). 시작하면 나타난다 */
.fresh .scene .pop{visibility:hidden}

/* 시작 덮개 */
.start{position:absolute;inset:0;background:rgba(21,38,43,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px}
.bigplay{width:clamp(72px,calc(var(--u) * 112),112px);height:clamp(72px,calc(var(--u) * 112),112px);border-radius:50%;border:none;background:#0F6670;display:flex;align-items:center;justify-content:center}
.bigplay:focus-visible{outline:4px solid #F6B8A0;outline-offset:4px}
.bigplay svg{width:45%;height:45%}
.start b{font-size:clamp(20px,calc(var(--u) * 24),24px);font-weight:700;color:#FFFFFF}
.start span{font-size:16px;color:#DCEDEE}

/* 조작 버튼 + 진행 막대 */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.btn{white-space:nowrap;height:52px;padding:0 18px;min-width:96px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-size:16px;font-weight:600}
.btn:hover{border-color:var(--teal)}
.btn.primary{min-width:140px;border:none;background:var(--teal);color:#FFFFFF;font-size:17px;font-weight:700}
.btn.primary:hover{background:var(--teal-dark)}
.bars{flex:1 1 200px;display:flex;gap:6px}
.bars i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.bars i.on{background:var(--teal)}
/* 휴대폰: 이전·재생·다음 한 줄, 소리·진행 막대 한 줄 */
@media (max-width:560px){
  .controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px}
  .controls .btn{min-width:0;padding:0 8px;white-space:normal;line-height:1.15;font-size:15px}
  .bars{grid-column:2 / 4}
}

/* 오른쪽 패널 */
aside{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.panel h2{font-size:16px;font-weight:700;margin:0}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lessons li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted)}
.lessons li b{font-size:15px}
.lessons li span{font-size:12px;font-weight:700}
.lessons li.done{color:var(--fg)}
.lessons li.now{background:#DCEDEE;border-color:#0F6670;color:#0B4E56}
.legend{display:flex;align-items:center;gap:10px;font-size:15px}
.legend i{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;color:#FFFFFF}
.legend .x{background:#D9363E}.legend .o{background:#2E9E6B}.legend .q{background:#E0A82E;color:#15262B}
.note{background:#FFF6D6;border:1px solid #E8D28A;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;color:#5C4405}

@keyframes lcBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lcWave{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-22deg)}}
@keyframes lcPoint{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-12deg)}}
@keyframes lcTalk{0%,100%{opacity:0}50%{opacity:1}}
@keyframes gsDraw{to{stroke-dashoffset:0}}
@keyframes gsPop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:gsPop .4s ease-out both;transform-box:fill-box;transform-origin:center}
.pop.left{animation-duration:.45s;transform-origin:left center}
.draw{animation:gsDraw .35s ease-out forwards}
.draw.slow{animation-duration:.6s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}
  .draw{stroke-dashoffset:0!important}}
</style>
</head>
<body class="wait">
<div class="wrap">
  <header>
    <button class="btn" id="backBtn" type="button" data-t="back"></button>
    <h1 id="title" data-t="title"></h1>
    <span class="crumb" id="crumb" data-t="crumb"></span>
    <span class="sample" data-t="sample"></span>
  </header>

  <div class="main">
    <div class="player">
      <div class="screen" id="screen">
        <svg class="scene" id="scene" role="img" viewBox="0 0 896 504"></svg>

        <svg class="ttobak" id="ttobak" data-pose="wave" aria-hidden="true" viewBox="-24 -16 248 236">
          <g class="bob">
            <g class="pose p-wave">
              <g class="arm">
                <path d="M150 116 Q176 104 182 80" fill="none" stroke="#15262B" stroke-width="5" stroke-linecap="round"/>
                <circle cx="183" cy="74" r="8" fill="#FFFFFF" stroke="#15262B" stroke-width="4"/>
              </g>
              <path d="M44 120 Q24 132 24 150" fill="none" stroke="#15262B" stroke-width="5" stroke-linecap="round"/>
              <circle cx="24" cy="154" r="8" fill="#FFFFFF" stroke="#15262B" stroke-width="4"/>
            </g>
            <g class="pose p-point">
              <g class="arm">
                <path d="M150 118 Q172 114 180 98" fill="none" stroke="#15262B" stroke-width="5" stroke-linecap="round"/>
                <path d="M186 86 L214 40" stroke="#C99A6B" stroke-width="5" stroke-linecap="round"/>
                <circle cx="216" cy="36" r="5" fill="#F4F1E8" stroke="#15262B" stroke-width="2"/>
                <circle cx="182" cy="92" r="8" fill="#FFFFFF" stroke="#15262B" stroke-width="4"/>
              </g>
              <path d="M44 120 Q24 132 24 150" fill="none" stroke="#15262B" stroke-width="5" stroke-linecap="round"/>
              <circle cx="24" cy="154" r="8" fill="#FFFFFF" stroke="#15262B" stroke-width="4"/>
            </g>
            <g class="pose p-cheer">
              <path d="M150 108 Q174 92 176 64" fill="none" stroke="#15262B" stroke-width="5" stroke-linecap="round"/>
              <path d="M46 108 Q22 92 20 64" fill="none" stroke="#15262B" stroke-width="5" stroke-linecap="round"/>
              <circle cx="176" cy="58" r="8" fill="#FFFFFF" stroke="#15262B" stroke-width="4"/>
              <circle cx="20" cy="58" r="8" fill="#FFFFFF" stroke="#15262B" stroke-width="4"/>
              <polygon points="98,-12 101.5,-4.8 109.4,-3.7 103.7,1.9 105,9.7 98,6 91,9.7 92.3,1.9 86.6,-3.7 94.5,-4.8" fill="#F2B94B" stroke="#15262B" stroke-width="2.5" stroke-linejoin="round"/>
            </g>
            <rect x="74" y="180" width="16" height="24" rx="8" fill="#15262B"/>
            <rect x="110" y="180" width="16" height="24" rx="8" fill="#15262B"/>
            <path d="M50 24 H128 L160 56 V170 A16 16 0 0 1 144 186 H50 A16 16 0 0 1 34 170 V40 A16 16 0 0 1 50 24 Z" fill="#FFFFFF" stroke="#15262B" stroke-width="4" stroke-linejoin="round"/>
            <path d="M128 24 V48 A8 8 0 0 0 136 56 H160 Z" fill="#DCEDEE" stroke="#15262B" stroke-width="4" stroke-linejoin="round"/>
            <circle cx="58" cy="48" r="10" fill="#0F6670"/>
            <path d="M58 42 V54 M52 48 H64" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M62 150 H134 M62 164 H110" stroke="#CAD6D6" stroke-width="5" stroke-linecap="round"/>
            <ellipse cx="68" cy="110" rx="9" ry="5.5" fill="#F6B8A0"/>
            <ellipse cx="128" cy="110" rx="9" ry="5.5" fill="#F6B8A0"/>
            <g class="face f-cheer">
              <path d="M73 96 Q80 88 87 96 M109 96 Q116 88 123 96" fill="none" stroke="#15262B" stroke-width="4" stroke-linecap="round"/>
              <path d="M86 108 Q98 124 110 108 Z" fill="#15262B" stroke="#15262B" stroke-width="3" stroke-linejoin="round"/>
            </g>
            <g class="face f-normal">
              <ellipse cx="80" cy="94" rx="5.5" ry="7.5" fill="#15262B"/>
              <ellipse cx="116" cy="94" rx="5.5" ry="7.5" fill="#15262B"/>
              <circle cx="82" cy="91" r="1.8" fill="#FFFFFF"/>
              <circle cx="118" cy="91" r="1.8" fill="#FFFFFF"/>
              <path d="M88 110 Q98 120 108 110" fill="none" stroke="#15262B" stroke-width="4" stroke-linecap="round"/>
              <ellipse class="talk" cx="98" cy="114" rx="7" ry="6" fill="#15262B"/>
            </g>
          </g>
        </svg>

        <div class="bubble">
          <span class="say" id="say" aria-live="polite"></span>
          <div class="acts" id="acts" hidden></div>
        </div>

        <div class="start" id="start">
          <button type="button" class="bigplay" id="bigplay">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5 L19 12 L8 19 Z" fill="#FFFFFF"/></svg>
          </button>
          <b data-t="start"></b>
          <span data-t="startHint"></span>
        </div>
      </div>

      <div class="controls">
        <button type="button" class="btn" id="prevBtn" data-t="prev"></button>
        <button type="button" class="btn primary" id="playBtn"></button>
        <button type="button" class="btn" id="nextBtn" data-t="next"></button>
        <button type="button" class="btn" id="soundBtn" aria-pressed="true"></button>
        <div class="bars" id="bars" aria-hidden="true"></div>
      </div>
    </div>

    <aside>
      <div class="panel">
        <h2 data-t="todayLessons"></h2>
        <ol class="lessons" id="lessons"></ol>
      </div>
      <div class="panel">
        <h2 data-t="legendTitle"></h2>
        <div class="legend"><i class="x" aria-hidden="true">✕</i><span data-t="legendX"></span></div>
        <div class="legend"><i class="o" aria-hidden="true">○</i><span data-t="legendO"></span></div>
        <div class="legend"><i class="q" aria-hidden="true">!</i><span data-t="legendQ"></span></div>
      </div>
      <div class="note" data-t="note"></div>
    </aside>
  </div>
</div>

<script>
// ===== 그림 =====
// 사진: [주소, 그림 안에서의 너비, 높이]. 자르는 범위(view)는 시안 좌표 그대로 쓴다.
const IMG={
  porridge:['/images/foods/food-05-porridge.jpg',1600,900],
  rice:['/images/foods/food-08-white-rice.jpg',1600,900],
  water:['/images/foods/food-09-water.jpg',1200,900],
  pills:['/images/foods/food-10-pills.jpg',1200,900],
  cig:['/images/foods/food-11-smoking.jpg',1200,900],
  guardian:['/images/foods/food-12-guardian.jpg',1200,900],
  gum:['/images/foods/food-13-gum.jpg',1200,900],
  clock:['/images/gastro/gastro-01-midnight-clock.jpg',1200,900],
  bed:['/images/gastro/gastro-02-bed.jpg',1200,900],
  coffee:['/images/gastro/gastro-03-coffee.jpg',1200,900],
  car:['/images/gastro/gastro-04-car.jpg',1200,900],
  bus:['/images/gastro/gastro-05-bus.jpg',1200,900],
  waiting:['/images/gastro/gastro-06-waiting.jpg',1200,900],
  stool:['/images/gastro/gastro-07-black-stool.jpg',1200,900],
  vomit:['/images/gastro/gastro-08-vomit-blood.jpg',1200,900],
  pain:['/images/gastro/gastro-09-stomach-pain.jpg',1200,900]
};
const INK='#15262B',RED='#D9363E',GREEN='#2E9E6B',YELLOW='#E0A82E',LINE='#CAD6D6';
const BG='<rect x="0" y="0" width="896" height="504" fill="#EAF2F0"/>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 글자 하나. maxW(그림 안 최대 너비)를 주면 fit()이 긴 번역을 글자 크기 줄이기(필요하면 두 줄)로 칸 안에 맞춘다.
const T=(x,y,size,weight,fill,text,anchor,maxW,wrap)=>`<text x="${x}" y="${y}"${anchor?' text-anchor="middle"':''} font-size="${size}" font-weight="${weight}" fill="${fill}"${maxW?` data-w="${maxW}"`:''}${wrap?` data-h="${wrap}"`:''}>${esc(text)}</text>`;
const late=d=>d?` style="animation-delay:${d}s"`:'';
function photo(key,x,y,w,h,view){const [src,iw,ih]=IMG[key];
  return `<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="${view}" preserveAspectRatio="xMidYMid slice"><image href="${src}" x="0" y="0" width="${iw}" height="${ih}"/></svg>`+
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="none" stroke="${LINE}" stroke-width="2"/>`}
// 위쪽 제목 띠: kind o(초록 ○) / x(빨강 ✕) / q(노랑 !)
function banner(kind,title,sub){const c={o:GREEN,x:RED,q:YELLOW}[kind],sym={o:'○',x:'✕',q:'!'}[kind];
  return `<g class="pop left"><rect x="24" y="20" width="586" height="120" rx="20" fill="#FFFFFF" stroke="${c}" stroke-width="4"/>`+
    `<circle cx="78" cy="80" r="32" fill="${c}"/>${T(78,93,34,700,kind==='q'?INK:'#FFFFFF',sym,1)}`+
    `${T(126,72,40,700,INK,title,0,468)}${T(126,118,27,600,'#2E4A50',sub,0,468)}</g>`}
// 사진 카드(아래 짧은 이름)
function card(x,w,key,view,label,d){
  return `<g class="pop"${late(d)}><rect x="${x}" y="158" width="${w}" height="188" rx="18" fill="#FFFFFF" stroke="${LINE}" stroke-width="2.5"/>`+
    photo(key,x+8,166,w-16,128,view)+T(x+w/2,324,24,700,INK,label,1,w-16,50)+'</g>'}
function xmark(cx,d){return [[cx-40,cx+40,d],[cx+40,cx-40,d+.35]].map(([a,b,t])=>
  `<path d="M${a} 188 L${b} 268" stroke="${RED}" stroke-width="10" stroke-linecap="round" stroke-dasharray="300" stroke-dashoffset="300" class="draw"${late(t)}/>`).join('')}
function omark(cx,cy,r,d){return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${GREEN}" stroke-width="9" stroke-dasharray="600" stroke-dashoffset="600" transform="rotate(-90 ${cx} ${cy})" class="draw slow"${late(d)}/>`}
function bang(cx,d){return `<g class="pop"${late(d)}><circle cx="${cx}" cy="184" r="20" fill="${YELLOW}" stroke="${INK}" stroke-width="3"/>${T(cx,192,24,700,INK,'!',1)}</g>`}
function redFrame(x,w,d){return `<rect x="${x}" y="158" width="${w}" height="188" rx="18" fill="none" stroke="${RED}" stroke-width="4" class="pop"${late(d)}/>`}

// 장면. X는 앱이 고른 언어의 글자(scene)이다. 그림·좌표·순서는 시안 그대로다.
const SCENES={

// 장면 안 글자를 칸에 맞춘다. 칸보다 길면 글자를 줄이고(최소 62%), 칸 높이(data-h)가 허락하면 2~3줄로 나눠
// 가장 크게 보이는 쪽을 고른다(줄 수가 같은 크기면 적은 쪽). 띠 모양 상자(data-pill)는 글자 너비에 맞춘다.
function splitLines(text,n){
  if(n===1)return[text];
  const words=text.split(' ');
  if(words.length>=n){ // 띄어쓰기 단위로, 가장 긴 줄이 짧아지게 앞에서부터 채운다
    const total=text.length,target=total/n,lines=[];let cur='';
    for(const w of words){
      if(cur&&lines.length<n-1&&(cur+' '+w).length>target&&Math.abs(cur.length-target)<Math.abs((cur+' '+w).length-target)){lines.push(cur);cur=w}
      else cur=cur?cur+' '+w:w}
    lines.push(cur);return lines}
  const per=Math.ceil(text.length/n);return Array.from({length:n},(_,i)=>text.slice(i*per,(i+1)*per)).filter(Boolean)}
function fit(){
  const svg=$('scene');
  svg.querySelectorAll('text[data-w]').forEach(el=>{
    const max=+el.dataset.w,size=+el.getAttribute('font-size'),text=el.textContent;
    const probe=(line,fs)=>{el.setAttribute('font-size',String(fs));el.textContent=line;return el.getBBox().width};
    const w1=probe(text,size);
    let best={n:1,fs:Math.min(size,size*max/w1),lines:[text]};
    if(el.dataset.h){
      for(const n of [2,3]){
        if(n*1.1*size*.62>+el.dataset.h)continue;
        const lines=splitLines(text,n);if(lines.length<2)continue;
        const widest=Math.max(...lines.map(l=>probe(l,size)));
        let fs=Math.min(size,size*max/widest,+el.dataset.h/(lines.length*1.1));
        if(fs>best.fs*1.08)best={n:lines.length,fs,lines};
      }
    }
    const fs=Math.max(best.fs,size*.5);
    el.setAttribute('font-size',String(fs));
    if(best.lines.length===1)el.textContent=best.lines[0];
    else{const x=el.getAttribute('x'),n=best.lines.length;
      el.innerHTML=best.lines.map((l,i)=>`<tspan x="${x}" dy="${i===0?-(n-1)*.55:1.1}em">${esc(l)}</tspan>`).join('')}
  });
  svg.querySelectorAll('rect[data-pill]').forEach(r=>{
    const t=r.nextElementSibling,b=t.getBBox(),w=Math.max(44,Math.ceil(b.width)+20),c=+r.dataset.pill;
    r.setAttribute('width',String(w));r.setAttribute('x',String(c-w/2));
  });
}

// ===== 수업 내용: 앱이 보내 준 글자(gastro-lesson.ts, 고른 언어로 번역된 것) =====
let TX=null,LINES=[],QUIZ=null,CHEER='',LANG='ko';
const QUIZ_CORRECT=1,QUIZ_BACK=5,LESSONS=[1,2,3,4];
const VOICE_LANG={ko:'ko-KR',en:'en-US',ja:'ja-JP',zh:'zh-CN',vi:'vi-VN'};
// **…**로 감싼 부분은 말풍선에서 색을 칠한다(번역에 ** 가 없으면 강조 없이 그대로 보인다).
function parseMark(s){const m=/\*\*(.+?)\*\*/.exec(s);
  return m?{plain:s.replace(/\*\*/g,''),pre:s.slice(0,m.index),mark:m[1],post:s.slice(m.index+m[0].length).replace(/\*\*/g,'')}:{plain:s.replace(/\*\*/g,''),pre:s.replace(/\*\*/g,''),mark:'',post:''}}

// ===== 상태 =====
const $=id=>document.getElementById(id);
const st={line:0,maxLine:0,playing:false,started:false,quiz:false,cheer:false,done:false,wrong:-1};
let HAS_NEXT=false,token=0,timer=null,reviewing=false,sound=true,shownScene=null,voice=null;
function set(patch){Object.assign(st,patch);render()}

// ===== 소리 =====
// 읽어 주는 목소리는 고른 언어(ko-KR / en-US / ja-JP / zh-CN / vi-VN)를 따른다. 그 언어 목소리가 없으면 기기 기본 목소리로 읽는다.
// 읽을 때만 또박이 이름을 발음용 철자로 바꾼다(앱이 언어별로 알려 준다. 화면 글자는 그대로).
let SPEECH_NAME=null;
function spokenText(t){return SPEECH_NAME&&SPEECH_NAME.written!==SPEECH_NAME.spoken?t.split(SPEECH_NAME.written).join(SPEECH_NAME.spoken):t}
function pickVoice(){const tag=VOICE_LANG[LANG]||'ko-KR',v=speechSynthesis.getVoices();
  voice=v.find(x=>x.lang&&x.lang.replace('_','-')===tag)||v.find(x=>x.lang&&x.lang.toLowerCase().startsWith(tag.slice(0,2)))||null}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=pickVoice}
function stopAll(){token++;if(timer){clearTimeout(timer);timer=null}try{speechSynthesis.cancel()}catch(e){}}
// 읽기가 끝나고 최소 시간(minMs)도 지나면 다음으로. 소리가 안 나는 기기에서도 넘어가도록 시간 안전장치를 둔다.
function say(text,cb,minMs){
  text=parseMark(text).plain;
  stopAll();const my=token;let fired=false,spoke=false,minDone=false;
  const fin=()=>{if(my===token&&!fired){fired=true;if(cb)cb()}};
  const tryFin=()=>{if(spoke&&minDone)fin()};
  setTimeout(()=>{minDone=true;tryFin()},minMs||0);
  if(sound&&'speechSynthesis' in window){try{
    const u=new SpeechSynthesisUtterance(spokenText(text));u.lang=VOICE_LANG[LANG]||'ko-KR';if(voice)u.voice=voice;u.pitch=1.3;u.rate=.88;
    u.onend=()=>setTimeout(()=>{spoke=true;tryFin()},600);
    speechSynthesis.speak(u);
  }catch(e){}}
  else setTimeout(()=>{spoke=true;tryFin()},text.length*180+800);
  timer=setTimeout(fin,Math.max(text.length*280+1800,(minMs||0)+800));
}

// ===== 흐름 =====
function playLine(l){set({line:l,maxLine:Math.max(st.maxLine,l),quiz:false,cheer:false,done:false,wrong:-1});say(LINES[l].text,()=>afterLine(l),3400)}
function afterLine(l){if(reviewing){reviewing=false;enterQuiz();return}if(l<LINES.length-1)playLine(l+1);else enterQuiz()}
function enterQuiz(){set({quiz:true,wrong:-1});say(QUIZ.q,null,0);setTimeout(()=>$('acts').querySelector('.opt')?.focus(),50)}
function answer(i){
  if(!st.quiz)return;
  if(!st.playing)set({playing:true});
  if(i===QUIZ_CORRECT){
    reviewing=false;set({quiz:false,cheer:true});
    tellApp({type:'stat-lesson-finished',lesson:'gastroscopy'});
    say(CHEER,()=>{stopAll();set({done:true,playing:false})},1500);
  }else{
    set({wrong:i});reviewing=true;
    say(TX.ui.retry,()=>playLine(QUIZ_BACK),900);
  }
}
function restart(){reviewing=false;set({playing:true,started:true,maxLine:0});playLine(0)}

// ===== 화면 그리기 =====
function render(){
  if(!TX)return;
  const cur=LINES[st.line],finished=st.quiz||st.cheer||st.done;
  const v=!st.started||st.cheer||st.done?'intro':(st.quiz?LINES[QUIZ_BACK]:cur).view;
  let sub,tone='r';
  if(!st.started){sub=TX.ui.firstSay}
  else if(st.cheer||st.done){sub=CHEER;tone='g'}
  else if(st.quiz){sub=QUIZ.q}
  else{sub=cur.text;tone=cur.tone}

  // 장면은 바뀔 때만 다시 그린다(그때 그림이 하나씩 나타난다)
  if(shownScene!==v){$('scene').innerHTML=BG+SCENES[v](TX.scene);fit();shownScene=v}
  const pm=parseMark(sub);
  $('scene').setAttribute('aria-label',TX.ui.sceneLabel+': '+pm.plain);

  $('say').innerHTML=pm.mark?esc(pm.pre)+`<mark class="${tone}">${esc(pm.mark)}</mark>`+esc(pm.post):esc(pm.plain);

  const acts=$('acts');
  if(st.quiz){
    if(!acts.dataset.quiz||acts.dataset.wrong!==String(st.wrong)){
      acts.innerHTML=QUIZ.opts.map((o,i)=>`<button type="button" class="opt${st.wrong===i?' wrong':''}" data-i="${i}">${esc(o)}</button>`).join('');
      acts.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
      acts.dataset.quiz='1';acts.dataset.wrong=String(st.wrong);
    }
    acts.hidden=false;
  }else if(st.done){
    acts.innerHTML=`<button type="button" class="again" id="againBtn">${esc(TX.ui.again)}</button>`;
    $('againBtn').onclick=restart;delete acts.dataset.quiz;acts.hidden=false;
  }else{acts.innerHTML='';delete acts.dataset.quiz;acts.hidden=true}

  const cheer=st.cheer||st.done,wave=!cheer&&!st.quiz&&(!st.started||st.line===0);
  $('ttobak').dataset.pose=cheer?'cheer':wave?'wave':'point';
  const screen=$('screen');
  screen.classList.toggle('playing',st.playing);
  screen.classList.toggle('moving',st.playing&&!st.quiz);
  screen.classList.toggle('cheering',st.cheer);
  screen.classList.toggle('fresh',!st.started);
  $('start').hidden=st.started;

  $('lessons').innerHTML=LESSONS.map(n=>{
    let lastIdx=0;LINES.forEach((x,i)=>{if(x.lesson===n)lastIdx=i});
    const now=st.started&&!finished&&cur.lesson===n,dn=st.started&&(st.maxLine>lastIdx||finished);
    return `<li class="${now?'now':dn?'done':''}" data-lesson="${n}" role="button" tabindex="0"><b>${esc(TX.lessonNames[n-1])}</b><span>${now?esc(TX.ui.now):dn?esc(TX.ui.done):''}</span></li>`}).join('');
  // 오른쪽 "오늘의 수업" 목록: 누르면 그 교시의 첫 장면으로 바로 넘어간다.
  $('lessons').querySelectorAll('li').forEach(li=>{
    const go=()=>{const idx=LINES.findIndex(x=>x.lesson===+li.dataset.lesson);if(idx<0)return;reviewing=false;set({started:true,playing:true});playLine(idx)};
    li.onclick=go;li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}};
  });
  [...$('bars').children].forEach((b,i)=>b.className=st.started&&i<=st.maxLine?'on':'');
  $('playBtn').textContent=st.playing?TX.ui.pause:TX.ui.play;
}

// ===== 앱에서 받은 글자를 화면에 넣기 =====
function applyTexts(language,texts){
  TX=texts;LANG=VOICE_LANG[language]?language:'ko';
  LINES=texts.lines;
  QUIZ={q:texts.quiz.question,opts:texts.quiz.options};CHEER=texts.cheer;
  document.documentElement.lang=LANG;document.title=texts.ui.frameTitle;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=texts.ui[el.dataset.t]});
  $('bigplay').setAttribute('aria-label',texts.ui.startLabel);
  if('speechSynthesis' in window)pickVoice();
  showSound();
  shownScene=null; // 언어가 바뀌면 그림 안 글자도 다시 그린다
  document.body.classList.remove('wait');
  render();
}

// ===== 버튼 =====
for(let i=0;i<9;i++)$('bars').appendChild(document.createElement('i'));
$('bigplay').onclick=()=>{set({started:true,playing:true});playLine(0)};
$('playBtn').onclick=()=>{
  if(st.playing){stopAll();set({playing:false});return}
  set({started:true,playing:true});
  if(st.done)restart();
  else if(st.quiz)say(QUIZ.q,null,0);
  else playLine(st.line);
};
function step(n){reviewing=false;
  if(st.playing)playLine(n);else{stopAll();set({started:true,line:n,maxLine:Math.max(st.maxLine,n),quiz:false,cheer:false,done:false})}}
$('prevBtn').onclick=()=>step(Math.max(0,st.line-1));
$('nextBtn').onclick=()=>{
  // 마지막 장면(퀴즈 포함)에서 "다음": 같은 장면을 다시 틀지 않고, 다음 안내가 있으면 앱이 넘겨 주고 없으면 수업 완료 화면.
  if(st.line===LINES.length-1){
    reviewing=false;stopAll();
    if(HAS_NEXT){set({started:true,playing:false});tellApp({type:'stat-lesson-next',lesson:'gastroscopy'})}
    else{set({started:true,playing:false,maxLine:LINES.length-1,quiz:false,cheer:true,done:true});tellApp({type:'stat-lesson-finished',lesson:'gastroscopy'})}
    return}
  step(st.line+1)};
function showSound(){const b=$('soundBtn');b.setAttribute('aria-pressed',String(sound));if(TX)b.textContent=sound?TX.ui.soundOn:TX.ui.soundOff}
$('soundBtn').onclick=()=>{sound=!sound;try{localStorage.setItem('stat-sound',sound?'on':'off')}catch(_){}showSound();if(!sound)try{speechSynthesis.cancel()}catch(_){}};
$('backBtn').onclick=()=>{if(history.length>1)history.back();else location.href='/'};
try{if(localStorage.getItem('stat-sound')==='off'){sound=false;showSound()}}catch(_){}

// ===== 앱 연결: 앱 화면(/p/[교육번호]/gastroscopy) 안에 끼워 넣었을 때 =====
// ?embed=1 로 열리면 앱 안이다. 제목·뒤로 버튼은 앱이 맡고, 다 보면 앱에 알리고, 높이를 알려 준다.
const EMBED=new URLSearchParams(location.search).has('embed');
function tellApp(msg){try{if(EMBED&&window.parent!==window)window.parent.postMessage(msg,location.origin)}catch(_){}}
if(EMBED){$('backBtn').hidden=true;$('title').hidden=true;$('crumb').hidden=true;document.documentElement.classList.add('embed')}
function sendHeight(){tellApp({type:'stat-lesson-height',lesson:'gastroscopy',height:Math.ceil(document.documentElement.scrollHeight),sideTop:Math.round(document.querySelector('.main').getBoundingClientRect().top+window.scrollY)})}
window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);
try{new ResizeObserver(sendHeight).observe(document.body)}catch(_){}
setTimeout(sendHeight,300);
// 앱에 글자를 달라고 부탁하고, 받으면 화면을 채운다(앱이 고른 언어로 번역해 보낸다).
window.addEventListener('message',e=>{
  if(e.origin!==location.origin||e.source!==window.parent)return;
  const d=e.data;
  // 앱이 받은 안내 칸을 오른쪽 칸 맨 위에 놓을 때, 이 목록을 그만큼 아래로 내린다.
  if(d&&d.type==='stat-lesson-offset'&&d.lesson==='gastroscopy'&&typeof d.offset==='number'){document.querySelector('aside').style.marginTop=Math.max(0,Math.round(d.offset))+'px';sendHeight();return}
  if(d&&d.type==='stat-lesson-has-next'&&d.lesson==='gastroscopy'){HAS_NEXT=d.hasNext===true;return}
  if(d&&d.type==='stat-lesson-texts'&&d.lesson==='gastroscopy'&&d.texts&&Array.isArray(d.texts.lines)){SPEECH_NAME=d.speechName&&d.speechName.written?d.speechName:null;applyTexts(d.language,d.texts)}
});
// ----- 전체 화면 영상 틀(앱의 src/app/p/video-frame.tsx)과 잇기 -----
// 재생을 누르면 앱에 알린다(휴대폰이면 앱이 전체 화면으로 연다). "크게 보기"는 언제나 전체 화면으로 연다.
// 앱이 전체 화면으로 열면 영상과 버튼만 남기고 16:9 영상을 가장 크게 맞춘다. 닫으면 일시정지한다.
const FULL_CSS='html.app-full,html.app-full body{height:100%;overflow:hidden;background:#000}html.app-full body{margin:0;padding:4px 0!important;box-sizing:border-box}html.app-full .wrap{max-width:none;height:100%;justify-content:center;gap:0}html.app-full header,html.app-full aside,html.app-full .hint,html.app-full #bigBtn{display:none!important}html.app-full .main{display:block}html.app-full .player{margin:0 auto}html.app-full .controls{display:flex!important;flex-wrap:nowrap;gap:8px}html.app-full .controls .btn{min-width:0;padding-left:12px;padding-right:12px;flex:none}html.app-full .controls .bars,html.app-full .controls .spacer{flex:1 1 0;min-width:0}';
if(EMBED){const s=document.createElement('style');s.textContent=FULL_CSS;document.head.appendChild(s)}
const bigBtn=document.createElement('button');bigBtn.type='button';bigBtn.className='btn';bigBtn.id='bigBtn';bigBtn.textContent='⛶ 크게 보기';
bigBtn.onclick=()=>tellApp({type:'stat-lesson-bigview',lesson:LESSON});
// 자막 줄 수가 바뀌어 높이가 달라져도 잘리지 않게, 전체 화면 동안에는 가장 작게 맞춘 너비를 쓴다(크기가 출렁이지 않게).
let fullMax=Infinity;
function fitFull(){const p=document.querySelector('.player');p.style.transform='';p.style.transformOrigin='';
  if(!document.documentElement.classList.contains('app-full')){p.style.width='';fullMax=Infinity;return}
  let w=innerWidth;for(let k=0;k<4;k++){p.style.width=w+'px';const rest=p.offsetHeight-w*9/16;w=Math.max(360,Math.min(innerWidth,fullMax,Math.floor((innerHeight-8-rest)*16/9)))}
  fullMax=w;if(p.style.width!==w+'px')p.style.width=w+'px';
  // 좁은 화면용 배치(말풍선이 그림 아래)라 그래도 높이가 모자라면, 내용은 그대로 두고 통째로 줄여 넣는다.
  const h=p.offsetHeight,room=innerHeight-8;
  if(h>room){const s=room/h;p.style.transformOrigin='top center';p.style.transform='translateY('+(h*(1-s)/2)+'px) scale('+s+')'}}window.addEventListener('resize',()=>{fullMax=Infinity;fitFull()});
try{new ResizeObserver(()=>requestAnimationFrame(fitFull)).observe(document.querySelector('.player'))}catch(_){}
const tellPlay=()=>tellApp({type:'stat-lesson-play',lesson:LESSON});
window.addEventListener('message',e=>{
  if(e.origin!==location.origin||e.source!==window.parent)return;
  const d=e.data;if(!d||d.lesson!==LESSON)return;
  if(d.type==='stat-lesson-full'){document.documentElement.classList.toggle('app-full',!!d.on);if(typeof d.bigView==='string'&&d.bigView)bigBtn.textContent='⛶ '+d.bigView;fitFull();sendHeight()}
  if(d.type==='stat-lesson-pause')pauseLesson();
});
const LESSON='gastroscopy';
function pauseLesson(){if(st.playing){stopAll();set({playing:false})}}
if(EMBED)$('soundBtn').after(bigBtn);
[$('bigplay'),$('playBtn')].forEach(b=>b.addEventListener('click',()=>{if(!st.playing)tellPlay()},true));
$('lessons').addEventListener('click',e=>{if(e.target.closest('button'))tellPlay()});
tellApp({type:'stat-lesson-ready',lesson:'gastroscopy'});
</script>
</body>
