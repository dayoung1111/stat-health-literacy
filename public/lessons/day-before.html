<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<style>
/* 기본 설정: hidden 속성이 항상 숨기도록 (덮개·퀴즈·뒤로 버튼) */
[hidden]{display:none!important}
/* 앱이 고른 언어의 글자를 보내 줄 때까지는 비워 둔다(한국어가 잠깐 보였다 바뀌는 것을 막는다) */
body.wait .wrap{visibility:hidden}
img{max-width:100%}
*{box-sizing:border-box}
body{font-size:14px}

/* 레이아웃: 가운데 16:9 수업 화면 + 오른쪽 교시 목록/배운 것 (휴대폰은 아래로) */
:root{
  --bg:#F2F6F6; --surface:#FFFFFF; --fg:#15262B; --muted:#5B6E72; --line:#D5E2E3;
  --teal:#0F6670; --mint:#DCEDEE; --red:#D9363E; --green:#2E9E6B; --cheek:#F6B8A0;
  /* 앱 본문(globals.css)과 같은 글꼴. 인터넷을 안 써서 막혀도 같게 보인다 */
  --display:Arial,Helvetica,sans-serif;
  --body:Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A1D; --surface:#16262A; --fg:#E7F0F1; --muted:#9DB2B5; --line:#2A3E43; --mint:#1F3A3E; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1A1D; --surface:#16262A; --fg:#E7F0F1; --muted:#9DB2B5; --line:#2A3E43; --mint:#1F3A3E; color-scheme:dark}

body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
header h1{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0;color:var(--fg)}
.crumb{font-size:.82rem;color:var(--muted);letter-spacing:.02em}
.sample{font-size:.75rem;background:var(--mint);color:var(--teal);padding:3px 9px;border-radius:99px;font-weight:700}
:root[data-theme="dark"] .sample{color:#7FD0D8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sample{color:#7FD0D8}}

.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}

/* ===== 수업 화면 (영상처럼 항상 밝은 화면) ===== */
.player{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;
  container-type:inline-size;background:#EBD9BE;box-shadow:0 1px 0 rgba(0,0,0,.04),0 8px 30px rgba(21,38,43,.12);user-select:none}
.stage:fullscreen{border-radius:0}
.table{position:absolute;inset:0;
  background:
   repeating-linear-gradient(90deg,rgba(150,105,60,.07) 0 2px,transparent 2px 9cqw),
   repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 1px,transparent 1px 3.1cqw),
   linear-gradient(170deg,#F3E4CB 0%,#E8D2B0 55%,#DEC39D 100%)}
.zoom{position:absolute;inset:0;transform-origin:35% 45%}
.zoom.go{animation:kb 14s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}

/* 왼쪽 2/3: 물건 카드 */
.items{position:absolute;left:4cqw;top:7cqw;width:58cqw;height:34cqw;display:flex;flex-wrap:wrap;
  align-content:center;justify-content:center;gap:2.2cqw}
.item{position:relative;width:16cqw;display:flex;flex-direction:column;align-items:center;gap:.8cqw;
  opacity:0;transform:translateY(1.5cqw) scale(.92);transition:opacity .5s,transform .5s}
.item.in{opacity:1;transform:none}
.plate{width:16cqw;height:16cqw;border-radius:50%;background:radial-gradient(circle at 50% 45%,#FFFFFF 0 55%,#F2F2EE 56% 64%,#E4E2DA 65%);
  box-shadow:0 1.2cqw 2cqw rgba(110,70,30,.18);display:grid;place-items:center;font-size:8cqw;line-height:1}
.item .lbl{font:700 1.9cqw/1.2 var(--body);color:#15262B;background:rgba(255,255,255,.85);padding:.35cqw 1.2cqw;border-radius:12px;max-width:100%;text-align:center}
.mark{position:absolute;left:-1cqw;top:-1cqw;width:18cqw;height:18cqw;pointer-events:none;overflow:visible}
.mark path,.mark circle{fill:none;stroke-width:9;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400}
.mark.x path{stroke:#D9363E}
.mark.o circle{stroke:#2E9E6B}
.mark.show path,.mark.show circle{animation:draw .55s ease-out forwards}
.mark.x.show path:nth-child(2){animation-delay:.28s}
@keyframes draw{to{stroke-dashoffset:0}}

/* 시계 카드 */
.clockface{width:16cqw;height:16cqw}

/* 오른쪽 1/3: 또박이 */
.ttobak{position:absolute;right:3cqw;top:4cqw;width:27cqw;height:35cqw}
.ttobak svg{width:100%;height:100%;overflow:visible}
.bob{animation:bob 2.4s ease-in-out infinite;transform-origin:110px 230px}
@keyframes bob{50%{transform:translateY(-4px)}}
.pose{display:none}
.ttobak[data-pose="wave"] .p-wave,.ttobak[data-pose="point"] .p-point,.ttobak[data-pose="clock"] .p-clock,
.ttobak[data-pose="star"] .p-star,.ttobak[data-pose="palm"] .p-palm{display:inline}
.ttobak[data-pose="palm"] .m-smile,.ttobak[data-pose="clock"] .m-smile{display:none}
.m-flat{display:none}
.ttobak[data-pose="palm"] .m-flat,.ttobak[data-pose="clock"] .m-flat{display:inline}
.waving{animation:wave .9s ease-in-out infinite;transform-origin:160px 135px}
@keyframes wave{50%{transform:rotate(-14deg)}}
.twinkle{animation:tw 1s ease-in-out infinite}
@keyframes tw{50%{opacity:.35;transform:scale(.85)}}
.speaking .mouth-grp{animation:talk .28s ease-in-out infinite;transform-origin:105px 136px}
@keyframes talk{50%{transform:scaleY(1.6)}}

/* 장면 제목 */
.chip{position:absolute;left:3cqw;top:2.4cqw;font:700 2.3cqw/1 var(--display);color:#FFFFFF;background:#0F6670;
  padding:1cqw 2cqw;border-radius:99px;box-shadow:0 .5cqw 1.2cqw rgba(15,102,112,.3)}

/* 자막 말풍선 */
.sub{position:absolute;left:4cqw;right:4cqw;bottom:2.8cqw;min-height:9.5cqw;background:#FFFFFF;border:.35cqw solid #15262B;
  border-radius:2.4cqw;padding:1.6cqw 3cqw;display:flex;align-items:center;justify-content:center;text-align:center;
  font:700 3cqw/1.42 var(--body);color:#15262B;box-shadow:0 .6cqw 0 rgba(21,38,43,.15);text-wrap:balance}
.sub::after{content:"";position:absolute;right:15cqw;top:-1.9cqw;width:3cqw;height:3cqw;background:#FFFFFF;
  border-left:.35cqw solid #15262B;border-top:.35cqw solid #15262B;transform:rotate(45deg) skew(8deg,8deg)}
.sub b{font-weight:900;padding:0 .3cqw;border-radius:.6cqw}
.sub b.r{color:#C42530;background:#FDE6E7}
.sub b.g{color:#1F7D53;background:#E1F4EA}
.sub b.k{color:#0F6670;background:#DCEDEE}
.sub small{display:block;font-weight:500;font-size:.7em;color:#5B6E72;margin-top:.4cqw}

/* 시작 / 퀴즈 덮개 */
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;
  background:rgba(21,38,43,.55);backdrop-filter:blur(2px);text-align:center;padding:4cqw}
.cover h2{font:700 4.4cqw/1.25 var(--display);color:#FFFFFF;margin:0;text-wrap:balance}
.cover p{font:500 2.2cqw/1.4 var(--body);color:#E7F0F1;margin:0}
.bigplay{width:12cqw;height:12cqw;border-radius:50%;border:none;background:#FFFFFF;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 1cqw 3cqw rgba(0,0,0,.3)}
.bigplay svg{width:5cqw;height:5cqw;margin-left:.8cqw}
.quiz{background:rgba(255,253,248,.96)}
.quiz h2{color:#15262B}
.quiz .qtag{font:700 2.2cqw/1 var(--display);color:#FFFFFF;background:#D9363E;padding:.9cqw 2cqw;border-radius:99px}
.opts{display:flex;gap:2.4cqw;flex-wrap:wrap;justify-content:center}
.opt{font:700 3cqw/1.2 var(--body);padding:2cqw 4cqw;border-radius:2cqw;border:.4cqw solid #15262B;background:#FFFFFF;color:#15262B;
  cursor:pointer;min-width:24cqw;box-shadow:0 .6cqw 0 #15262B;transition:transform .1s}
.opt:active{transform:translateY(.4cqw);box-shadow:0 .2cqw 0 #15262B}
.opt:focus-visible,.bigplay:focus-visible{outline:.6cqw solid #F6B8A0;outline-offset:.4cqw}
.feedback{font:700 2.8cqw/1.3 var(--body);min-height:3.6cqw}
.feedback.ok{color:#1F7D53}.feedback.no{color:#C42530}

/* 진행 막대 */
.prog{position:absolute;left:0;right:0;bottom:0;height:.7cqw;background:rgba(21,38,43,.12);display:flex;gap:2px}
.prog i{flex:1;background:transparent;position:relative;overflow:hidden}
.prog i.done{background:#0F6670}
.prog i.now::after{content:"";position:absolute;inset:0;background:#0F6670;transform-origin:left;animation:fill var(--d,6s) linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* 조작 버튼 */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:700 .92rem/1 var(--body);display:inline-flex;align-items:center;gap:7px;padding:11px 15px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--teal)}
.btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#FFFFFF}
.btn svg{width:16px;height:16px}
.spacer{flex:1}
.hint{font-size:.8rem;color:var(--muted)}

/* 오른쪽 패널 */
aside{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h3{font-family:var(--display);font-weight:700;font-size:1.1rem;margin:0 0 10px}
.chapters{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.chapters button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:9px 10px;border-radius:9px;border:none;
  background:transparent;color:var(--fg);font:500 .92rem/1.35 var(--body);cursor:pointer}
.chapters button:hover{background:var(--mint)}
.chapters button:focus-visible{outline:2px solid var(--teal)}
.chapters .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 .78rem/1 var(--body);
  border:1.5px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.chapters .now button{background:var(--mint);font-weight:700}
.chapters .now .n{border-color:var(--teal);color:var(--teal)}
.chapters .done .n{background:var(--teal);border-color:var(--teal);color:#FFFFFF}
.learned{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.learned li{display:flex;gap:9px;font-size:.9rem;line-height:1.45}
.learned li::before{content:"";flex:none;width:8px;height:8px;margin-top:.5em;border-radius:50%;background:var(--green)}
.learned .empty{color:var(--muted)}
.learned .empty::before{background:var(--line)}
.note{font-size:.8rem;color:var(--muted);line-height:1.55}

@media (prefers-reduced-motion:reduce){.zoom.go,.bob,.waving,.twinkle,.speaking .mouth-grp{animation:none}
  .mark.show path,.mark.show circle{animation-duration:.01s}}

/* 자막: 한 문장으로 이어지게 */
.sub{display:flex;flex-direction:column;align-items:stretch;justify-content:center;text-wrap:wrap}
.sub .txt{display:block;width:100%;text-align:center;line-height:1.5;word-break:keep-all}
.sub .txt b{display:inline}
.waving{transform-origin:72px 138px}
.speaking .mouth-grp{transform-origin:122px 145px}

/* 그림 크게: 개수에 따라 접시 크기 (복용약 수업과 같게) */
.items{left:3cqw;top:5.5cqw;width:65cqw;height:37cqw;gap:1.6cqw;--p:15cqw}
.items[data-n="1"]{--p:31cqw}
.items[data-n="2"]{--p:26cqw;gap:5cqw}
.items[data-n="3"]{--p:19cqw}
.item{width:var(--p)}
.plate{width:var(--p);height:var(--p);font-size:calc(var(--p) * .64)}
.plate svg,.plate .clockface{width:80%;height:80%;overflow:visible}
.mark{left:-1cqw;top:-1cqw;width:calc(var(--p) + 2cqw);height:calc(var(--p) + 2cqw)}
.item .lbl{font-size:2.1cqw}

.plate.photo{background:#FFFFFF;padding:.7cqw;box-sizing:border-box}
.plate.photo img{width:100%;height:100%;max-width:100%;object-fit:cover;border-radius:50%;display:block}

/* 말풍선 작게 (글씨 크기는 그대로) */
.sub{left:5cqw;right:5cqw;bottom:1.8cqw;min-height:7cqw;padding:.9cqw 2.6cqw;border-radius:2cqw}
.sub .txt{line-height:1.35}
.sub small{margin-top:.2cqw}
.sub::after{top:-1.7cqw;width:2.6cqw;height:2.6cqw}
.items{top:4.5cqw;height:36cqw}
.items[data-n="1"]{--p:27cqw}

/* 앱 안에 끼워 넣었을 때: 바깥 여백은 앱이 맡는다 */
.embed body{padding-block:4px 8px}

/* 번역으로 길어진 글자: 글자 크기는 lesson 스크립트(fit*)가 칸에 맞게 줄이고, 단어 중간에서는 자르지 않는다 */
.chip{max-width:62cqw;white-space:nowrap}
.item .lbl{overflow-wrap:normal;word-break:normal;white-space:normal}
.sub .txt{word-break:normal;overflow-wrap:break-word}
:lang(ko) .sub .txt,.sub .txt:lang(ko){word-break:keep-all}
.chapters button{overflow-wrap:anywhere}
.cover h2,.cover p,.opt{overflow-wrap:break-word}
/* 휴대폰 */
@media (max-width:520px){
  .controls{gap:6px}
  .btn{padding:10px 12px;font-size:.86rem;min-height:44px;white-space:normal;text-align:center}
  .spacer{display:none}
}
</style>

</head>
<body class="wait">
<div class="wrap">
  <header>
    <button class="btn" id="backBtn" type="button" data-t="back"></button>
    <h1 id="title" data-t="title"></h1>
    <span class="crumb" id="crumb" data-t="crumb"></span>
  </header>

  <div class="main">
    <div class="player">
      <div class="stage" id="stage">
        <div class="table"></div>
        <div class="zoom" id="zoom"><div class="items" id="items"></div></div>

        <div class="ttobak" id="ttobak" data-pose="wave">
          <svg viewBox="0 0 230 250" role="img">
            <g class="bob">
              <!-- 다리: 짧은 막대 -->
              <rect x="102" y="196" width="10" height="20" rx="5" fill="#15262B"/>
              <rect x="132" y="196" width="10" height="20" rx="5" fill="#15262B"/>
              <!-- 오른팔(쉬는 팔) -->
              <path d="M172 156 Q180 164 182 174" stroke="#15262B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
              <circle cx="182" cy="177" r="5.5" fill="#FFFFFF" stroke="#15262B" stroke-width="3"/>
              <!-- 몸통: 왼쪽 위 접힌 종이 -->
              <path d="M98 72 H160 Q172 72 172 84 V188 Q172 200 160 200 H84 Q72 200 72 188 V98 Z" fill="#FFFFFF" stroke="#15262B" stroke-width="3.5" stroke-linejoin="round"/>
              <path d="M98 72 V90 Q98 98 90 98 H72 Z" fill="#DCEDEE" stroke="#15262B" stroke-width="3.5" stroke-linejoin="round"/>
              <!-- 오른쪽 위 초록 원 + 흰 십자 -->
              <circle cx="154" cy="92" r="9" fill="#0F6670"/>
              <rect x="152.2" y="86" width="3.6" height="12" rx="1.6" fill="#FFFFFF"/><rect x="148" y="90.2" width="12" height="3.6" rx="1.6" fill="#FFFFFF"/>
              <!-- 아래 회색 줄 -->
              <g stroke="#CDD6D8" stroke-width="4" stroke-linecap="round"><line x1="94" y1="172" x2="150" y2="172"/><line x1="104" y1="184" x2="140" y2="184"/></g>
              <!-- 얼굴 -->
              <ellipse cx="109" cy="130" rx="4.6" ry="6.2" fill="#15262B"/><ellipse cx="135" cy="130" rx="4.6" ry="6.2" fill="#15262B"/>
              <circle cx="110.6" cy="127.6" r="1.6" fill="#FFFFFF"/><circle cx="136.6" cy="127.6" r="1.6" fill="#FFFFFF"/>
              <ellipse cx="97" cy="145" rx="7.5" ry="4.6" fill="#F6B8A0"/><ellipse cx="147" cy="145" rx="7.5" ry="4.6" fill="#F6B8A0"/>
              <g class="mouth-grp">
                <path class="m-smile" d="M114 142 Q122 149 130 142" stroke="#15262B" stroke-width="3" fill="none" stroke-linecap="round"/>
                <ellipse class="m-flat" cx="122" cy="145" rx="3" ry="3" fill="#15262B"/>
              </g>
              <!-- 손 흔들기 -->
              <g transform="translate(0 16)" class="pose p-wave"><g class="waving">
                <path d="M72 138 Q58 126 52 106" stroke="#15262B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                <circle cx="51" cy="101" r="6" fill="#FFFFFF" stroke="#15262B" stroke-width="3"/></g></g>
              <!-- 지시봉 -->
              <g transform="translate(0 16)" class="pose p-point">
                <line x1="50" y1="118" x2="24" y2="64" stroke="#C8956A" stroke-width="4" stroke-linecap="round"/>
                <circle cx="22" cy="60" r="4.5" fill="#FFFFFF" stroke="#15262B" stroke-width="2.5"/>
                <path d="M72 140 Q58 136 53 125" stroke="#15262B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                <circle cx="51" cy="121" r="6" fill="#FFFFFF" stroke="#15262B" stroke-width="3"/></g>
              <!-- 알람 시계 -->
              <g transform="translate(0 16)" class="pose p-clock">
                <circle cx="26" cy="98" r="5.5" fill="#D9363E" stroke="#15262B" stroke-width="2.5"/><circle cx="54" cy="98" r="5.5" fill="#D9363E" stroke="#15262B" stroke-width="2.5"/>
                <circle cx="40" cy="116" r="18" fill="#FFFFFF" stroke="#15262B" stroke-width="3.5"/>
                <line x1="40" y1="116" x2="40" y2="105" stroke="#15262B" stroke-width="3" stroke-linecap="round"/>
                <line x1="40" y1="116" x2="48" y2="121" stroke="#15262B" stroke-width="3" stroke-linecap="round"/>
                <path d="M72 144 Q62 144 56 138" stroke="#15262B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                <circle cx="53" cy="135" r="6" fill="#FFFFFF" stroke="#15262B" stroke-width="3"/></g>
              <!-- 칭찬: 팔 들고 별 -->
              <g transform="translate(0 16)" class="pose p-star">
                <path d="M72 138 Q58 120 55 102" stroke="#15262B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                <circle cx="54" cy="97" r="6" fill="#FFFFFF" stroke="#15262B" stroke-width="3"/>
                <path class="twinkle" d="M30 52 l4.5 9.5 10.5 1 -8 7 2.5 10.5 -9.5 -5.5 -9.5 5.5 2.5 -10.5 -8 -7 10.5 -1z" fill="#F4C34A" stroke="#15262B" stroke-width="2.2" stroke-linejoin="round"/>
                <path class="twinkle" style="animation-delay:.4s" d="M196 64 l3.2 6.8 7.3 .6 -5.5 5 1.8 7.3 -6.8 -3.8 -6.8 3.8 1.8 -7.3 -5.5 -5 7.3 -.6z" fill="#F4C34A" stroke="#15262B" stroke-width="2.2" stroke-linejoin="round"/></g>
              <!-- 주의: 손바닥 내밀기 -->
              <g transform="translate(0 16)" class="pose p-palm">
                <path d="M72 144 Q58 140 48 134" stroke="#15262B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                <ellipse cx="40" cy="130" rx="8" ry="10" fill="#FFFFFF" stroke="#15262B" stroke-width="3"/>
                <g stroke="#D9363E" stroke-width="3.5" stroke-linecap="round"><line x1="24" y1="113" x2="17" y2="107"/><line x1="22" y1="130" x2="13" y2="130"/><line x1="24" y1="147" x2="17" y2="153"/></g></g>
            </g>
          </svg>
        </div>

        <div class="chip" id="chip"></div>
        <div class="sub" id="sub"><span class="txt"></span></div>
        <div class="prog" id="prog"></div>

        <div class="cover" id="start">

const $=id=>document.getElementById(id);

// ===== 수업 내용: 앱이 보내 준 글자(day-before-lesson.ts, 고른 언어로 번역된 것) =====
// 그림·순서·나타나는 때는 여기 SPEC 그대로이고, 글자만 TX에서 온다. show = 그 줄이 나올 때 나타날 물건 번호, mark = 그때 그려질 표시.
const SPEC=[
 {pose:'wave',items:[],lines:[{},{}]},
 {pose:'point',items:[{img:'porridge'},{img:'soup'},{img:'oily'}],
  lines:[{show:[0,1],mark:{0:'o',1:'o'}},{show:[2],mark:{2:'x'}},{pose:'palm'}]},
 {pose:'clock',items:[{clock:1},{img:'water'},{img:'gum'},{img:'cig'}],
  lines:[{show:[0]},{show:[1],mark:{1:'x'},pose:'palm'},{show:[2,3],mark:{2:'x',3:'x'}},{pose:'point'}]},
 {pose:'palm',items:[{img:'beer'},{img:'soju'},{img:'wine'}],
  lines:[{show:[0,1,2],mark:{0:'x',1:'x',2:'x'}},{pose:'point'}]},
 {pose:'palm',items:[{img:'squat'},{img:'run'}],
  lines:[{show:[0,1],mark:{0:'x',1:'x'}},{pose:'point'}]},
 {pose:'star',items:[{img:'sleep'}],
  lines:[{show:[0],mark:{0:'o'}},{pose:'point'},{pose:'star'}]}
];
const QUIZ_SPEC=[{a:1,back:2},{a:1,back:3}];
const VOICE_LANG={ko:'ko-KR',en:'en-US',ja:'ja-JP',zh:'zh-CN',vi:'vi-VN'};
let HAS_NEXT=false,TX=null,LANG='ko',scenes=[],quizzes=[],cheer='',voice=null,fitTimer=null;
// **…**로 감싼 부분은 말풍선에서 색을 칠한다(번역에 ** 가 없으면 강조 없이 그대로 보인다).
function parseMarks(s){const parts=[];let plain='';
  s.split('**').forEach((seg,i)=>{plain+=seg;if(seg)parts.push({t:seg,mark:i%2===1})});
  return{plain,parts}}
function markup(s,tone){return parseMarks(s).parts.map(p=>p.mark?`<b class="${tone}">${esc(p.t)}</b>`:esc(p.t)).join('')}
const plainOf=s=>parseMarks(s).plain;
function buildScenes(){
  scenes=SPEC.map((sp,i)=>{const t=TX.scenes[i],cut=t.name.indexOf(' · ');
    return{name:t.name,title:cut>=0?t.name.slice(cut+3):t.name,pose:sp.pose,learned:t.learned,
      items:sp.items.map((it,k)=>({...it,l:t.labels[k]})),
      lines:sp.lines.map((ln,k)=>({...ln,t:t.lines[k].text,small:t.lines[k].small,tone:t.lines[k].tone}))}});
  quizzes=QUIZ_SPEC.map((q,i)=>({...q,q:TX.quizzes[i].question,opts:TX.quizzes[i].options,ok:TX.quizzes[i].ok}));
  cheer=TX.cheer;
}

// ===== 글자를 칸에 맞추기 =====
// 번역하면 글자가 길어질 수 있다. 칸(말풍선·이름표·제목·퀴즈)에 안 맞으면 글자 크기를 조금씩 줄인다.
// 크기는 수업 화면 너비 기준(cqw)이라 화면이 달라져도 비율이 같다.
function shrink(el,base,tooBig){
  el.style.fontSize='';
  let k=1;
  while(tooBig(el)&&k>.45){k-=.04;el.style.fontSize=(base*k).toFixed(2)+'cqw'}
}
function fitAll(){
  if(!TX)return;
  const w=stage.clientWidth;if(!w)return;
  const cq=w/100;
  shrink(chip,2.3,e=>e.scrollWidth>e.clientWidth+1);
  document.querySelectorAll('.item .lbl').forEach(e=>shrink(e,parseFloat(e.dataset.base||'2.1'),
    x=>x.scrollWidth>x.clientWidth+1||x.offsetHeight>2.7*parseFloat(getComputedStyle(x).fontSize)*1.2));
  // 말풍선: 그림 영역(약 41cqw) 아래에서만 자란다
  shrink(sub,3,e=>e.offsetHeight>13.2*cq||e.scrollWidth>e.clientWidth+1);
  document.querySelectorAll('.cover').forEach(c=>{
    if(c.hidden)return;
    const kids=[...c.children],pad=8*cq;
    const used=()=>kids.reduce((a,k)=>a+k.offsetHeight,0)+2*cq*(kids.length-1);
    const h2=c.querySelector('h2'),opts=c.querySelector('.opts'),pP=c.querySelector('p');
    const base=[[h2,4.4],[pP,2.2]],optEls=[...c.querySelectorAll('.opt')];
    let k=1;
    const setK=()=>{base.forEach(([e,b])=>{if(e)e.style.fontSize=(b*k).toFixed(2)+'cqw'});
      optEls.forEach(o=>o.style.fontSize=(3*k).toFixed(2)+'cqw')};
    setK();
    while(used()>c.clientHeight-pad&&k>.45){k-=.04;setK()}
  });
}
function fitSoon(){clearTimeout(fitTimer);fitTimer=setTimeout(fitAll,30)}

// 목차
function renderChapters(){
  $('chapters').innerHTML='';
  scenes.forEach((s,i)=>{const li=document.createElement('li');li.innerHTML=`<button type="button"><span class="n">${i+1}</span>${esc(s.title)}</button>`;
    li.querySelector('button').onclick=()=>{returnToQuiz=null;hideQuiz();go(i,true)};$('chapters').appendChild(li)});
}
const prog=$('prog');
function renderSide(){
  [...$('chapters').children].forEach((li,i)=>{li.className=i===cur?'now':done.has(i)?'done':''});
  [...prog.children].forEach((b,i)=>{b.className=i<cur||done.has(i)&&i!==cur?'done':''});
  const L=scenes.filter((s,i)=>s.learned&&done.has(i));
  $('learned').innerHTML=L.length?L.map(s=>`<li>${esc(s.learned)}</li>`).join(''):`<li class="empty">${esc(TX.ui.learnedEmpty)}</li>`;
}
function buildScene(i){
  const s=scenes[i];chip.textContent=s.name;tt.dataset.pose=s.pose;
  itemsEl.dataset.n=s.items.length;itemsEl.innerHTML=s.items.map(it=>`<div class="item"><div class="plate${it.img?' photo':''}">${it.img?`<img src="${PHOTO[it.img]}" alt="${esc(it.l)}" decoding="async">`:it.clock?CLOCK9():''}</div><span class="lbl">${esc(it.l)}</span></div>`).join('');
  zoom.classList.remove('go');void zoom.offsetWidth;zoom.classList.add('go');
  fitSoon();
}
function applyLine(i,ln){
  const s=scenes[i];sub.innerHTML='<span class="txt">'+markup(ln.t,ln.tone)+'</span>'+(ln.small?`<small>${esc(ln.small)}</small>`:'');tt.dataset.pose=ln.pose||s.pose;
  const els=itemsEl.children;
  (ln.show||[]).forEach(k=>els[k]&&els[k].classList.add('in'));
  Object.entries(ln.mark||{}).forEach(([k,m])=>{const el=els[k];if(!el)return;
    setTimeout(()=>{el.insertAdjacentHTML('beforeend',m==='x'?X_SVG:O_SVG);requestAnimationFrame(()=>el.lastChild&&el.lastChild.classList&&el.lastChild.classList.add('show'))},500)});
  fitSoon();
}

// ===== 소리 =====
// 읽어 주는 목소리는 고른 언어(ko-KR / en-US / ja-JP / zh-CN / vi-VN)를 따른다. 그 언어 목소리가 없으면 기기 기본 목소리로 읽는다.
// 읽을 때만 또박이 이름을 발음용 철자로 바꾼다(앱이 언어별로 알려 준다. 화면 글자는 그대로).
let SPEECH_NAME=null;
function spokenText(t){return SPEECH_NAME&&SPEECH_NAME.written!==SPEECH_NAME.spoken?t.split(SPEECH_NAME.written).join(SPEECH_NAME.spoken):t}
function pickVoice(){const tag=VOICE_LANG[LANG]||'ko-KR',v=speechSynthesis.getVoices();
  voice=v.find(x=>x.lang&&x.lang.replace('_','-')===tag)||v.find(x=>x.lang&&x.lang.toLowerCase().startsWith(tag.slice(0,2)))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
// 읽는 글자 수로 걸리는 시간을 어림한다(한·중·일은 글자가 곧 음절, 영어·베트남어는 단어 수로 본다)
const spoken=t=>{const p=plainOf(t);return /[぀-ヿ一-鿿가-힣]/.test(p)?p.length:p.split(/\s+/).length*3}
function say(text){
  text=plainOf(text);
  const est=1400+spoken(text)*150;
  return new Promise(res=>{
    let fin=false,started=false;const end=()=>{if(!fin){fin=true;tt.classList.remove('speaking');res()}};
    tt.classList.add('speaking');
    // 소리가 안 나는 기기에서도 화면은 반드시 넘어가도록 시간 안전장치를 둔다
    setTimeout(()=>{if(!started)setTimeout(end,Math.max(0,est-1500))},1500);
    setTimeout(end,est*2);
    if(sound&&'speechSynthesis' in window){
      try{
        if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(spokenText(text));u.lang=VOICE_LANG[LANG]||'ko-KR';if(voice)u.voice=voice;u.pitch=1.3;u.rate=.88;
        u.onstart=()=>{started=true};u.onend=()=>setTimeout(end,400);u.onerror=()=>{started=false};
        setTimeout(()=>{try{speechSynthesis.speak(u)}catch(e){}},60);
      }catch(e){}
    }
  });
}
async function playFrom(i){
  const my=++token;playing=true;setPlayUI();
  for(let s=i;s<scenes.length;s++){
    cur=s;buildScene(s);renderSide();
    const bar=prog.children[s];const tot=scenes[s].lines.reduce((a,l)=>a+1200+spoken(l.t)*150,0);
    bar.className='now';bar.style.setProperty('--d',tot+'ms');
    for(const ln of scenes[s].lines){if(my!==token)return;applyLine(s,ln);await say(ln.t,my);if(my!==token)return}
    done.add(s);renderSide();
    if(returnToQuiz!==null){const q=returnToQuiz;returnToQuiz=null;playing=false;setPlayUI();showQuiz(q);return}
  }
  // 퀴즈 없이 바로 끝낸다(퀴즈 글자·함수는 남겨 둠).
  playing=false;setPlayUI();finish();
}
function stop(){token++;playing=false;try{speechSynthesis.cancel()}catch(e){}tt.classList.remove('speaking');setPlayUI();
  [...prog.children].forEach(b=>{if(b.className==='now')b.className=''});}
function go(i,autoplay){stop();cur=Math.max(0,Math.min(scenes.length-1,i));$('start').hidden=true;
  if(autoplay)playFrom(cur);else{buildScene(cur);applyAll(cur);renderSide()}}
function applyAll(i){scenes[i].lines.forEach(ln=>applyLine(i,ln))}
function setPlayUI(){if(!TX)return;$('playLbl').textContent=playing?TX.ui.pause:TX.ui.play;
  $('playBtn').querySelector('svg').innerHTML=playing?'<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>':'<path d="M6 4l14 8-14 8z" fill="currentColor"/>'}

// 퀴즈
function showQuiz(n){
  const q=quizzes[n];$('quiz').hidden=false;$('qtext').textContent=plainOf(q.q);$('fb').textContent='';$('fb').className='feedback';
  $('opts').innerHTML=q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('');
  say(q.q);fitSoon();
  $('opts').querySelectorAll('.opt').forEach(b=>b.onclick=async()=>{
    const k=+b.dataset.k;$('opts').querySelectorAll('.opt').forEach(x=>x.disabled=true);
    if(k===q.a){$('fb').textContent=plainOf(q.ok);$('fb').className='feedback ok';tt.dataset.pose='star';fitSoon();await say(q.ok);
      if(n+1<quizzes.length)showQuiz(n+1);else finish()}
    else{const m=TX.ui.retry;$('fb').textContent=m;$('fb').className='feedback no';fitSoon();await say(m);
      hideQuiz();returnToQuiz=n;go(q.back,true)}
  });
  setTimeout(()=>$('opts').querySelector('.opt')?.focus(),50);
}
function hideQuiz(){$('quiz').hidden=true}
async function finish(){hideQuiz();tellApp({type:'stat-lesson-finished',lesson:'day-before'});buildScene(0);chip.textContent=TX.ui.finishChip;tt.dataset.pose='star';
  sub.innerHTML='<span class="txt">'+markup(cheer,'g')+'</span>';fitSoon();await say(cheer);
  // 다 보면(마지막 교시까지) 다음 안내가 있으면 앱이 바로 넘겨 준다.
  if(HAS_NEXT)tellApp({type:'stat-lesson-next',lesson:'day-before'})}

// 버튼
$('backBtn').onclick=()=>{if(history.length>1)history.back();else location.href='/';};
$('bigplay').onclick=()=>{$('start').hidden=true;playFrom(0)};
$('playBtn').onclick=()=>{if(!$('quiz').hidden)return;$('start').hidden=true;if(playing)stop();else playFrom(cur)};
$('prevBtn').onclick=()=>{returnToQuiz=null;hideQuiz();go(cur-1,playing)};
$('nextBtn').onclick=()=>{returnToQuiz=null;hideQuiz();
  // 마지막 장면에서 "다음": 같은 장면을 다시 틀지 않고, 다음 안내가 있으면 앱이 넘겨 주고 없으면 수업 완료 화면.
  if(cur===scenes.length-1){stop();$('start').hidden=true;if(HAS_NEXT)tellApp({type:'stat-lesson-next',lesson:'day-before'});else finish();return}
  go(cur+1,playing)};
function showSound(){const b=$('soundBtn');b.setAttribute('aria-pressed',String(sound));if(TX)b.textContent=sound?TX.ui.soundOn:TX.ui.soundOff}
$('soundBtn').onclick=()=>{sound=!sound;try{localStorage.setItem('stat-sound',sound?'on':'off')}catch(_){}showSound();if(!sound)try{speechSynthesis.cancel()}catch(_){}};
$('fsBtn').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else{await stage.requestFullscreen();
  try{await screen.orientation.lock('landscape')}catch(_){}}}catch(_){}};
try{if(localStorage.getItem('stat-sound')==='off'){sound=false}}catch(_){}

// ===== 앱에서 받은 글자를 화면에 넣기 =====
function applyTexts(language,texts){
  const first=!TX;
  TX=texts;LANG=VOICE_LANG[language]?language:'ko';
  document.documentElement.lang=LANG;document.title=texts.ui.frameTitle;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=texts.ui[el.dataset.t]});
  $('bigplay').setAttribute('aria-label',texts.ui.startLabel);
  $('prevBtn').setAttribute('aria-label',texts.ui.prevLabel);
  $('nextBtn').setAttribute('aria-label',texts.ui.nextLabel);
  tt.querySelector('svg').setAttribute('aria-label',texts.ui.ttobak);
  if('speechSynthesis' in window)pickVoice();
  buildScenes();
  if(first)for(let i=0;i<scenes.length;i++)prog.appendChild(document.createElement('i'));
  renderChapters();showSound();setPlayUI();
  if(first){buildScene(1);applyAll(1);cur=0}   // 첫 화면: 장면 2를 멈춘 상태로 보여 주기(미리보기)
  else{stop();hideQuiz();buildScene(cur);applyAll(cur)}
  renderSide();
  document.body.classList.remove('wait');
  fitSoon();
}

// ===== 앱 연결: 앱 화면(/p/[교시번호]/day-before) 안에 끼워 넣었을 때 =====
// ?embed=1 로 열리면 앱 안이다. 앱의 소리 설정(stat-sound)을 따르고, 다 보면 앱에 알리고, 높이를 알려 준다.
const EMBED=new URLSearchParams(location.search).has('embed');
function tellApp(msg){try{if(EMBED&&window.parent!==window)window.parent.postMessage(msg,location.origin)}catch(_){}}
if(EMBED){$('backBtn').hidden=true;document.documentElement.classList.add('embed');}
function sendHeight(){tellApp({type:'stat-lesson-height',lesson:'day-before',height:Math.ceil(document.documentElement.scrollHeight),sideTop:Math.round(document.querySelector('.main').getBoundingClientRect().top+window.scrollY)})}
window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);
try{new ResizeObserver(()=>{sendHeight();fitSoon()}).observe(document.body)}catch(_){}
setTimeout(sendHeight,300);
// 앱에 글자를 달라고 부탁하고, 받으면 화면을 채운다(앱이 고른 언어로 번역해 보낸다).
window.addEventListener('message',e=>{
  if(e.origin!==location.origin||e.source!==window.parent)return;
  const d=e.data;
  // 앱이 받은 안내 칸을 오른쪽 칸 맨 위에 놓을 때, 이 목록을 그만큼 아래로 내린다.
  if(d&&d.type==='stat-lesson-offset'&&d.lesson==='day-before'&&typeof d.offset==='number'){document.querySelector('aside').style.marginTop=Math.max(0,Math.round(d.offset))+'px';sendHeight();return}
  if(d&&d.type==='stat-lesson-has-next'&&d.lesson==='day-before'){HAS_NEXT=d.hasNext===true;return}
  if(d&&d.type==='stat-lesson-texts'&&d.lesson==='day-before'&&d.texts&&Array.isArray(d.texts.scenes)){SPEECH_NAME=d.speechName&&d.speechName.written?d.speechName:null;applyTexts(d.language,d.texts)}
});
// ----- 전체 화면 영상 틀(앱의 src/app/p/video-frame.tsx)과 잇기 -----
// 재생을 누르면 앱에 알린다(휴대폰이면 앱이 전체 화면으로 연다). "크게 보기"는 언제나 전체 화면으로 연다.
// 앱이 전체 화면으로 열면 영상과 버튼만 남기고 16:9 영상을 가장 크게 맞춘다. 닫으면 일시정지한다.
const FULL_CSS='html.app-full,html.app-full body{height:100%;overflow:hidden;background:#000}html.app-full body{margin:0;padding:4px 0!important;box-sizing:border-box}html.app-full .wrap{max-width:none;height:100%;justify-content:center;gap:0}html.app-full header,html.app-full aside,html.app-full .hint,html.app-full #bigBtn{display:none!important}html.app-full .main{display:block}html.app-full .player{margin:0 auto}html.app-full .controls{display:flex!important;flex-wrap:nowrap;gap:8px}html.app-full .controls .btn{min-width:0;padding-left:12px;padding-right:12px;flex:none}html.app-full .controls .bars,html.app-full .controls .spacer{flex:1 1 0;min-width:0}';
if(EMBED){const s=document.createElement('style');s.textContent=FULL_CSS;document.head.appendChild(s)}
const bigBtn=document.createElement('button');bigBtn.type='button';bigBtn.className='btn';bigBtn.id='bigBtn';bigBtn.textContent='⛶ 크게 보기';
bigBtn.onclick=()=>tellApp({type:'stat-lesson-bigview',lesson:LESSON});
// 자막 줄 수가 바뀌어 높이가 달라져도 잘리지 않게, 전체 화면 동안에는 가장 작게 맞춘 너비를 쓴다(크기가 출렁이지 않게).
let fullMax=Infinity;
function fitFull(){const p=document.querySelector('.player');p.style.transform='';p.style.transformOrigin='';
  if(!document.documentElement.classList.contains('app-full')){p.style.width='';fullMax=Infinity;return}
  let w=innerWidth;for(let k=0;k<4;k++){p.style.width=w+'px';const rest=p.offsetHeight-w*9/16;w=Math.max(360,Math.min(innerWidth,fullMax,Math.floor((innerHeight-8-rest)*16/9)))}
  fullMax=w;if(p.style.width!==w+'px')p.style.width=w+'px';
  // 좁은 화면용 배치(말풍선이 그림 아래)라 그래도 높이가 모자라면, 내용은 그대로 두고 통째로 줄여 넣는다.
  const h=p.offsetHeight,room=innerHeight-8;
  if(h>room){const s=room/h;p.style.transformOrigin='top center';p.style.transform='translateY('+(h*(1-s)/2)+'px) scale('+s+')'}}window.addEventListener('resize',()=>{fullMax=Infinity;fitFull()});
try{new ResizeObserver(()=>requestAnimationFrame(fitFull)).observe(document.querySelector('.player'))}catch(_){}
const tellPlay=()=>tellApp({type:'stat-lesson-play',lesson:LESSON});
window.addEventListener('message',e=>{
  if(e.origin!==location.origin||e.source!==window.parent)return;
  const d=e.data;if(!d||d.lesson!==LESSON)return;
  if(d.type==='stat-lesson-full'){document.documentElement.classList.toggle('app-full',!!d.on);if(typeof d.bigView==='string'&&d.bigView)bigBtn.textContent='⛶ '+d.bigView;fitFull();sendHeight()}
  if(d.type==='stat-lesson-pause')pauseLesson();
});
const LESSON='day-before';
function pauseLesson(){if(playing)stop()}
if(EMBED){$('fsBtn').style.display='none';$('playBtn').after(bigBtn)}
$('bigplay').addEventListener('click',tellPlay,true);
$('playBtn').addEventListener('click',()=>{if(!playing&&$('quiz').hidden)tellPlay()},true);
$('chapters').addEventListener('click',e=>{if(e.target.closest('button'))tellPlay()});
// 앱이 아직 준비 전이라 알림을 놓쳤을 수 있으니, 글자가 올 때까지 0.5초마다 다시 알린다(최대 10초).
let readyTries=0;const readyTimer=setInterval(()=>{if(TX||++readyTries>20){clearInterval(readyTimer);return}tellApp({type:'stat-lesson-ready',lesson:'day-before'})},500);
tellApp({type:'stat-lesson-ready',lesson:'day-before'});
</script>
