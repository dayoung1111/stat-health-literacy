<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>또박이 사진 수업 PC</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6670}a:hover{color:#0B4E56}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #0F6670;outline-offset:2px}
@keyframes lcBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lcWave{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-22deg)}}
@keyframes lcPoint{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-12deg)}}
@keyframes lcTalk{0%,100%{opacity:0}50%{opacity:1}}
@keyframes phKb{from{transform:scale(1)}to{transform:scale(1.14)}}
@keyframes phKb2{from{transform:scale(1.14) translateX(-1.5%)}to{transform:scale(1.02) translateX(0)}}
@keyframes phFade{from{opacity:0}to{opacity:1}}
@keyframes phDraw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
@keyframes phDrawO{from{stroke-dashoffset:730}to{stroke-dashoffset:0}}
@keyframes phPop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #F3F6F5; color: #15262B; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; display: flex; flex-direction: column">

  <div style="height: 68px; flex: none; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border-bottom: 1px solid #CAD6D6">
    <div style="display: flex; align-items: baseline; gap: 14px">
      <span style="font-size: 22px; font-weight: 700">또박이 선생님 수업</span>
      <span style="font-size: 15px; color: #4A5D63">[병원 이름] 건강의학센터 · 대장내시경 준비</span>
    </div>
    <span style="font-size: 13px; font-weight: 600; color: #0B4E56; background: #DCEDEE; padding: 6px 12px; border-radius: 999px">간호사 승인 완료</span>
  </div>

  <div style="flex: 1; display: flex; gap: 28px; padding: 24px 40px; min-height: 0">

    <div style="width: 896px; flex: none; display: flex; flex-direction: column; gap: 14px">
      <div style="position: relative; width: 896px; height: 504px; border-radius: 18px; overflow: hidden; background: #C99A6B">

        <sc-if value="{{ph0}}" hint-placeholder-val="{{false}}">
          <img src="./assets/30f48947282a6b7a130002329e832929.jpg" alt="잡곡밥 사진" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 33% 46%; animation: phFade .6s ease-out both, phKb 7s ease-out forwards">
        </sc-if>
        <sc-if value="{{ph1}}" hint-placeholder-val="{{false}}">
          <img src="./assets/76da5c9799d07ad1dc6d9910900fa144.jpg" alt="김치와 콩나물무침 사진" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 33% 46%; animation: phFade .6s ease-out both, phKb2 7s ease-out forwards">
        </sc-if>
        <sc-if value="{{ph2}}" hint-placeholder-val="{{false}}">
          <img src="./assets/41856ac2194109fd3b8038c6aeb10a58.jpg" alt="구운 김과 미역 사진" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 33% 46%; animation: phFade .6s ease-out both, phKb 7s ease-out forwards">
        </sc-if>
        <sc-if value="{{ph3}}" hint-placeholder-val="{{false}}">
          <img src="./assets/88756d6844050501e7bf178be14c6901.jpg" alt="수박, 딸기, 포도 사진" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 33% 46%; animation: phFade .6s ease-out both, phKb2 7s ease-out forwards">
        </sc-if>
        <sc-if value="{{ph4}}" hint-placeholder-val="{{false}}">
          <img src="./assets/9f1572f61c16fb64586e624716206dff.jpg" alt="흰죽 사진" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 33% 46%; animation: phFade .6s ease-out both, phKb 7s ease-out forwards">
        </sc-if>
        <sc-if value="{{ph5}}" hint-placeholder-val="{{false}}">
          <img src="./assets/08f393e67bb8bc60989cc75ef92f0a12.jpg" alt="삶은 계란과 두부 사진" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 33% 46%; animation: phFade .6s ease-out both, phKb2 7s ease-out forwards">
        </sc-if>
        <sc-if value="{{ph6}}" hint-placeholder-val="{{false}}">
          <img src="./assets/63ab247200aff55c6cc14ebfccbe5b8d.jpg" alt="바나나와 사과 사진" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 33% 46%; animation: phFade .6s ease-out both, phKb 7s ease-out forwards">
        </sc-if>
        

        <sc-if value="{{isGrid}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; inset: 0; background: #E9D6BC"></div>
          <div style="position: absolute; left: 28px; top: 26px; width: 560px; display: flex; flex-direction: column; gap: 12px; animation: phFade .5s ease-out both">
            <span style="font-size: 28px; font-weight: 700; color: #15262B">{{gridTitle}}</span>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
              <sc-for list="{{thumbs}}" as="t" hint-placeholder-count="4">
                <div style="position: relative; height: 150px; border-radius: 14px; overflow: hidden; border: 3px solid {{t.border}}; background: #FFFFFF">
                  <img src="{{t.src}}" alt="{{t.name}}" style="width: 100%; height: 100%; object-fit: cover; object-position: 33% 46%">
                  <sc-if value="{{t.x}}" hint-placeholder-val="{{false}}">
                    <svg aria-hidden="true" width="120" height="120" viewBox="0 0 120 120" style="position: absolute; left: 50%; top: 50%; margin: -60px 0 0 -60px">
                      <path d="M14 14 L106 106" stroke="#D9363E" stroke-width="12" stroke-linecap="round" stroke-dasharray="400" style="stroke-dashoffset: 400; animation: phDraw .4s ease-out {{t.d1}}s forwards"></path>
                      <path d="M106 14 L14 106" stroke="#D9363E" stroke-width="12" stroke-linecap="round" stroke-dasharray="400" style="stroke-dashoffset: 400; animation: phDraw .4s ease-out {{t.d2}}s forwards"></path>
                    </svg>
                  </sc-if>
                  <sc-if value="{{t.o}}" hint-placeholder-val="{{false}}">
                    <svg aria-hidden="true" width="120" height="120" viewBox="0 0 120 120" style="position: absolute; left: 50%; top: 50%; margin: -60px 0 0 -60px">
                      <circle cx="60" cy="60" r="44" fill="none" stroke="#2E9E6B" stroke-width="11" stroke-linecap="round" stroke-dasharray="730" style="stroke-dashoffset: 730; animation: phDrawO .7s ease-out {{t.d1}}s forwards"></circle>
                    </svg>
                  </sc-if>
                  <span style="position: absolute; left: 8px; bottom: 8px; background: rgba(21, 38, 43, 0.82); color: #FFFFFF; font-size: 15px; font-weight: 700; padding: 3px 10px; border-radius: 999px">{{t.name}}</span>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{isPhoto}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; left: 24px; top: 22px; display: flex; align-items: center; gap: 10px; animation: phPop .4s ease-out both">
            <span style="background: {{pillBg}}; color: #FFFFFF; font-size: 18px; font-weight: 700; padding: 6px 14px; border-radius: 999px">{{pillText}}</span>
            <span style="background: rgba(255, 255, 255, 0.94); color: #15262B; font-size: 24px; font-weight: 700; padding: 3px 14px; border-radius: 12px">{{photoName}}</span>
          </div>
          <sc-if value="{{showX}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="300" height="300" viewBox="0 0 300 300" style="position: absolute; left: calc(33% - 150px); top: calc(46% - 150px)">
            <path d="M40 40 L260 260" stroke="#D9363E" stroke-width="22" stroke-linecap="round" stroke-dasharray="400" style="stroke-dashoffset: 400; animation: phDraw .45s ease-out 1.1s forwards"></path>
            <path d="M260 40 L40 260" stroke="#D9363E" stroke-width="22" stroke-linecap="round" stroke-dasharray="400" style="stroke-dashoffset: 400; animation: phDraw .45s ease-out 1.55s forwards"></path>
          </svg></sc-if>
          <sc-if value="{{showO}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="300" height="300" viewBox="0 0 300 300" style="position: absolute; left: calc(33% - 150px); top: calc(46% - 150px)">
            <circle cx="150" cy="150" r="112" fill="none" stroke="#2E9E6B" stroke-width="20" stroke-linecap="round" stroke-dasharray="730" transform="rotate(-90 150 150)" style="stroke-dashoffset: 730; animation: phDrawO .8s ease-out 1.1s forwards"></circle>
          </svg></sc-if>
        </sc-if>

        <svg role="img" aria-label="음식 사진을 가리키며 설명하는 또박이" width="230" height="219" viewBox="-24 -16 248 236" style="position: absolute; right: 36px; bottom: 98px; transform: scaleX(-1)">
          <g style="animation: {{bobAnim}}">
            <sc-if value="{{poseWave}}" hint-placeholder-val="{{false}}">
              <g style="transform-box: view-box; transform-origin: 150px 116px; animation: {{armAnim}}">
                <path d="M150 116 Q176 104 182 80" fill="none" stroke="#15262B" stroke-width="5" stroke-linecap="round"></path>
                <circle cx="183" cy="74" r="8" fill="#FFFFFF" stroke="#15262B" stroke-width="4"></circle>
              </g>
              <path d="M44 120 Q24 132 24 150" fill="none" stroke="#15262B" stroke-width="5" stroke-linecap="round"></path>
              <circle cx="24" cy="154" r="8" fill="#FFFFFF" stroke="#15262B" stroke-width="4"></circle>
            </sc-if>
            <sc-if value="{{posePoint}}" hint-placeholder-val="{{true}}">
              <g style="transform-box: view-box; transform-origin: 150px 118px; animation: {{armAnim}}">
                <path d="M150 118 Q172 114 180 98" fill="none" stroke="#15262B" stroke-width="5" stroke-linecap="round"></path>
                <path d="M186 86 L214 40" stroke="#C99A6B" stroke-width="5" stroke-linecap="round"></path>
                <circle cx="216" cy="36" r="5" fill="#F4F1E8" stroke="#15262B" stroke-width="2"></circle>
                <circle cx="182" cy="92" r="8" fill="#FFFFFF" stroke="#15262B" stroke-width="4"></circle>
              </g>
              <path d="M44 120 Q24 132 24 150" fill="none" stroke="#15262B" stroke-width="5" stroke-linecap="round"></path>
              <circle cx="24" cy="154" r="8" fill="#FFFFFF" stroke="#15262B" stroke-width="4"></circle>
            </sc-if>
            <sc-if value="{{poseCheer}}" hint-placeholder-val="{{false}}">
              <path d="M150 108 Q174 92 176 64" fill="none" stroke="#15262B" stroke-width="5" stroke-linecap="round"></path>
              <path d="M46 108 Q22 92 20 64" fill="none" stroke="#15262B" stroke-width="5" stroke-linecap="round"></path>
              <circle cx="176" cy="58" r="8" fill="#FFFFFF" stroke="#15262B" stroke-width="4"></circle>
              <circle cx="20" cy="58" r="8" fill="#FFFFFF" stroke="#15262B" stroke-width="4"></circle>
              <polygon points="98,-12 101.5,-4.8 109.4,-3.7 103.7,1.9 105,9.7 98,6 91,9.7 92.3,1.9 86.6,-3.7 94.5,-4.8" fill="#F2B94B" stroke="#15262B" stroke-width="2.5" stroke-linejoin="round"></polygon>
            </sc-if>
            <rect x="74" y="180" width="16" height="24" rx="8" fill="#15262B"></rect>
            <rect x="110" y="180" width="16" height="24" rx="8" fill="#15262B"></rect>
            <path d="M50 24 H128 L160 56 V170 A16 16 0 0 1 144 186 H50 A16 16 0 0 1 34 170 V40 A16 16 0 0 1 50 24 Z" fill="#FFFFFF" stroke="#15262B" stroke-width="4" stroke-linejoin="round"></path>
            <path d="M128 24 V48 A8 8 0 0 0 136 56 H160 Z" fill="#DCEDEE" stroke="#15262B" stroke-width="4" stroke-linejoin="round"></path>
            <circle cx="58" cy="48" r="10" fill="#0F6670"></circle>
            <path d="M58 42 V54 M52 48 H64" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"></path>
            <path d="M62 150 H134 M62 164 H110" stroke="#CAD6D6" stroke-width="5" stroke-linecap="round"></path>
            <ellipse cx="68" cy="110" rx="9" ry="5.5" fill="#F6B8A0"></ellipse>
            <ellipse cx="128" cy="110" rx="9" ry="5.5" fill="#F6B8A0"></ellipse>
            <sc-if value="{{poseCheer}}" hint-placeholder-val="{{false}}">
              <path d="M73 96 Q80 88 87 96 M109 96 Q116 88 123 96" fill="none" stroke="#15262B" stroke-width="4" stroke-linecap="round"></path>
              <path d="M86 108 Q98 124 110 108 Z" fill="#15262B" stroke="#15262B" stroke-width="3" stroke-linejoin="round"></path>
            </sc-if>
            <sc-if value="{{faceNormal}}" hint-placeholder-val="{{true}}">
              <ellipse cx="80" cy="94" rx="5.5" ry="7.5" fill="#15262B"></ellipse>
              <ellipse cx="116" cy="94" rx="5.5" ry="7.5" fill="#15262B"></ellipse>
              <circle cx="82" cy="91" r="1.8" fill="#FFFFFF"></circle>
              <circle cx="118" cy="91" r="1.8" fill="#FFFFFF"></circle>
              <path d="M88 110 Q98 120 108 110" fill="none" stroke="#15262B" stroke-width="4" stroke-linecap="round"></path>
              <ellipse cx="98" cy="114" rx="7" ry="6" fill="#15262B" style="opacity: 0; animation: {{talkAnim}}"></ellipse>
            </sc-if>
          </g>
        </svg>

        <div style="position: absolute; left: 20px; right: 20px; bottom: 16px; min-height: 78px; box-sizing: border-box; background: #FFFFFF; border: 3px solid #15262B; border-radius: 20px; padding: 12px 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
          <span style="position: absolute; top: -13px; right: 150px; width: 22px; height: 22px; background: #FFFFFF; border-left: 3px solid #15262B; border-top: 3px solid #15262B; transform: rotate(45deg); box-sizing: border-box"></span>
          <span style="font-size: 26px; font-weight: 700; line-height: 1.4; word-break: keep-all">{{subA}}<span style="background: {{keyBg}}; color: {{keyFg}}; border-radius: 8px; padding: 0 6px">{{subKey}}</span>{{subB}}</span>
          <sc-if value="{{quiz}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; gap: 10px; flex: none">
              <sc-for list="{{quizOpts}}" as="o" hint-placeholder-count="2">
                <button type="button" onClick="{{o.pick}}" style="min-width: 150px; height: 54px; border-radius: 14px; border: 2.5px solid #15262B; background: {{o.bg}}; color: #15262B; font-size: 20px; font-weight: 700">{{o.label}}</button>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
            <button type="button" onClick="{{replay}}" style="flex: none; height: 54px; border-radius: 14px; border: none; background: #0F6670; color: #FFFFFF; font-size: 18px; font-weight: 700; padding: 0 20px">처음부터 다시</button>
          </sc-if>
        </div>

        <sc-if value="{{showStart}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; inset: 0; background: rgba(21, 38, 43, 0.55); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
            <button type="button" onClick="{{play}}" aria-label="수업 시작" style="width: 112px; height: 112px; border-radius: 50%; border: none; background: #0F6670; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24"><path d="M8 5 L19 12 L8 19 Z" fill="#FFFFFF"></path></svg>
            </button>
            <span style="font-size: 24px; font-weight: 700; color: #FFFFFF">눌러서 수업 시작</span>
            <span style="font-size: 16px; color: #DCEDEE">소리를 켜 주세요</span>
          </div>
        </sc-if>
      </div>

      <div style="display: flex; align-items: center; gap: 14px">
        <button type="button" onClick="{{prev}}" style="height: 52px; width: 110px; border-radius: 14px; border: 1.5px solid #CAD6D6; background: #FFFFFF; color: #15262B; font-size: 16px; font-weight: 600">이전</button>
        <button type="button" onClick="{{toggle}}" style="height: 52px; width: 140px; border-radius: 14px; border: none; background: #0F6670; color: #FFFFFF; font-size: 17px; font-weight: 700">{{toggleLabel}}</button>
        <button type="button" onClick="{{next}}" style="height: 52px; width: 110px; border-radius: 14px; border: 1.5px solid #CAD6D6; background: #FFFFFF; color: #15262B; font-size: 16px; font-weight: 600">다음</button>
        <div style="flex: 1; display: flex; gap: 6px">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
            <div style="flex: 1; height: 8px; border-radius: 4px; background: {{b.bg}}"></div>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <div style="background: #FFFFFF; border: 1px solid #CAD6D6; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 16px; font-weight: 700">오늘의 수업</span>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <sc-for list="{{lessons}}" as="ls" hint-placeholder-count="3">
            <div style="display: flex; justify-content: space-between; align-items: center; background: {{ls.bg}}; border: 1.5px solid {{ls.bd}}; border-radius: 12px; padding: 9px 12px"><span style="font-size: 15px; font-weight: 700; color: {{ls.fg}}">{{ls.label}}</span><span style="font-size: 12px; font-weight: 600; color: {{ls.fg}}">{{ls.state}}</span></div>
          </sc-for>
        </div>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #CAD6D6; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 7px">
        <span style="font-size: 16px; font-weight: 700">이번 시간에 배운 것</span>
        <sc-for list="{{learned}}" as="l" hint-placeholder-count="7">
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="position: relative; width: 58px; height: 38px; flex: none; border-radius: 8px; overflow: hidden; border: 2px solid {{l.border}}">
              <img src="{{l.src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 33% 46%; opacity: {{l.op}}">
            </span>
            <span style="flex: 1; font-size: 15px; font-weight: 600; color: {{l.fg}}">{{l.name}}</span>
            <span style="font-size: 13px; font-weight: 700; color: {{l.stateFg}}">{{l.state}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { line: 0, maxLine: 0, playing: false, started: false, quiz: false, cheer: false, done: false, wrong: -1 };
    this.token = 0; this.timer = null; this.reviewing = false;
  }
  photos() {
    return [
      { src: './assets/30f48947282a6b7a130002329e832929.jpg', name: '잡곡밥', tone: 'no' },
      { src: './assets/76da5c9799d07ad1dc6d9910900fa144.jpg', name: '김치 · 나물', tone: 'no' },
      { src: './assets/41856ac2194109fd3b8038c6aeb10a58.jpg', name: '김 · 미역', tone: 'no' },
      { src: './assets/88756d6844050501e7bf178be14c6901.jpg', name: '씨 있는 과일', tone: 'no' },
      { src: './assets/9f1572f61c16fb64586e624716206dff.jpg', name: '흰쌀밥 · 흰죽', tone: 'ok' },
      { src: './assets/08f393e67bb8bc60989cc75ef92f0a12.jpg', name: '계란 · 두부', tone: 'ok' },
      { src: './assets/63ab247200aff55c6cc14ebfccbe5b8d.jpg', name: '바나나 · 사과', tone: 'ok' }
    ];
  }
  lines() {
    return [
      { part: 1, mode: 'intro', text: '검사 3일 전부터는 먹으면 안 되는 음식이 있어요.', key: '먹으면 안 되는 음식' },
      { part: 1, mode: 'photo', p: 0, text: '잡곡밥은 드시면 안 돼요.', key: '안 돼요' },
      { part: 1, mode: 'photo', p: 1, text: '김치와 콩나물 같은 나물도 안 돼요.', key: '안 돼요' },
      { part: 1, mode: 'photo', p: 2, text: '김과 미역도 안 돼요.', key: '안 돼요' },
      { part: 1, mode: 'photo', p: 3, text: '수박, 딸기, 포도처럼 씨 있는 과일도 안 돼요.', key: '안 돼요' },
      { part: 1, mode: 'summary', text: '이 네 가지는 검사 3일 전부터 드시지 마세요.', key: '드시지 마세요' },
      { part: 2, mode: 'intro', text: '이번에는 드셔도 되는 음식을 볼까요?', key: '드셔도 되는 음식' },
      { part: 2, mode: 'photo', p: 4, text: '흰쌀밥과 흰죽은 드셔도 돼요.', key: '드셔도 돼요' },
      { part: 2, mode: 'photo', p: 5, text: '삶은 계란과 두부도 괜찮아요.', key: '괜찮아요' },
      { part: 2, mode: 'photo', p: 6, text: '바나나와 사과도 드셔도 돼요.', key: '드셔도 돼요' },
      { part: 2, mode: 'summary', text: '이 음식들은 검사 전에도 드셔도 괜찮아요.', key: '괜찮아요' }
    ];
  }
  quizFor(part) {
    return part === 1
      ? { q: '김치는 먹어도 될까요?', key: '김치', opts: ['먹어도 돼요', '안 돼요'], correct: 1, back: 2, end: 5, praise: '잘하셨어요! 이제 드셔도 되는 음식을 배워요.' }
      : { q: '바나나는 먹어도 될까요?', key: '바나나', opts: ['먹어도 돼요', '안 돼요'], correct: 0, back: 9, end: 10, praise: '잘하셨어요! 오늘 수업 끝이에요.' };
  }
  stopAll() {
    this.token++;
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
  componentWillUnmount() { this.stopAll(); }
  say(text, cb, minMs) {
    var self = this;
    this.stopAll();
    var my = this.token, fired = false, spoke = false, minDone = false;
    var fin = function () { if (my === self.token && !fired) { fired = true; if (cb) cb(); } };
    var tryFin = function () { if (spoke && minDone) fin(); };
    setTimeout(function () { minDone = true; tryFin(); }, minMs || 0);
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; u.pitch = 1.3; u.rate = 0.88;
      u.onend = function () { setTimeout(function () { spoke = true; tryFin(); }, 600); };
      window.speechSynthesis.speak(u);
    } catch (e) {}
    this.timer = setTimeout(fin, Math.max(text.length * 280 + 1800, (minMs || 0) + 800));
  }
  partOf(l) { return this.lines()[l].part; }
  playLine(l) {
    var self = this, L = this.lines();
    this.setState({ line: l, maxLine: Math.max(this.state.maxLine, l), quiz: false, cheer: false, done: false, wrong: -1 });
    this.say(L[l].text, function () { self.afterLine(l); }, L[l].mode === 'photo' ? 3600 : 2400);
  }
  afterLine(l) {
    var q = this.quizFor(this.partOf(l));
    if (this.reviewing) { this.reviewing = false; this.enterQuiz(q); return; }
    if (l === q.end) this.enterQuiz(q); else this.playLine(l + 1);
  }
  enterQuiz(q) {
    this.setState({ quiz: true, cheer: false, wrong: -1, line: q.end, maxLine: Math.max(this.state.maxLine, q.end) });
    this.say(q.q, null, 0);
  }
  answer(i) {
    var self = this, q = this.quizFor(this.partOf(this.state.line));
    if (!this.state.quiz) return;
    if (!this.state.playing) this.setState({ playing: true });
    if (i === q.correct) {
      this.reviewing = false;
      this.setState({ quiz: false, cheer: true });
      this.say(q.praise, function () {
        if (q.end < self.lines().length - 1) self.playLine(q.end + 1);
        else { self.stopAll(); self.setState({ done: true, playing: false }); }
      }, 1500);
    } else {
      this.setState({ wrong: i });
      this.reviewing = true;
      this.say('다시 볼까요?', function () { self.playLine(q.back); }, 900);
    }
  }
  renderVals() {
    var self = this, st = this.state, L = this.lines(), P = this.photos(), on = st.playing;
    var cur = L[st.line], part = cur.part, q = this.quizFor(part);
    var mode = !st.started ? 'intro' : (st.quiz || st.cheer || st.done ? 'summary' : cur.mode);
    var sub, key;
    if (!st.started) { sub = '재생을 누르면 수업이 시작돼요.'; key = ''; }
    else if (st.cheer || st.done) { sub = q.praise; key = '잘하셨어요'; }
    else if (st.quiz) { sub = q.q; key = q.key; }
    else { sub = cur.text; key = cur.key; }
    var ki = key ? sub.indexOf(key) : -1;
    var good = key === '잘하셨어요' || /드셔도|괜찮아요/.test(key);
    var flags = {};
    P.forEach(function (p, i) { flags['ph' + i] = st.started && mode === 'photo' && cur.p === i; });
    var photo = mode === 'photo' ? P[cur.p] : null;
    var marked = mode === 'summary';
    var partPhotos = P.map(function (p, i) { return { p: p, i: i }; }).filter(function (o) { return (part === 1) === (o.p.tone === 'no'); });
    var thumbs = partPhotos.map(function (o, j) {
      var no = o.p.tone === 'no';
      return { src: o.p.src, name: o.p.name, x: marked && no, o: marked && !no,
        border: marked ? (no ? '#D9363E' : '#2E9E6B') : '#FFFFFF', d1: (0.3 + j * 0.35).toFixed(2), d2: (0.5 + j * 0.35).toFixed(2) };
    });
    var bars = L.map(function (x, i) { return { bg: st.started && i <= st.maxLine ? '#0F6670' : '#CAD6D6' }; });
    var finished = st.done || st.cheer || st.quiz;
    var learned = P.map(function (p, i) {
      var li = -1; L.forEach(function (x, k) { if (x.p === i) li = k; });
      var now = st.started && !finished && st.line === li;
      var heard = st.started && (st.maxLine > li || (finished && st.maxLine >= li));
      var no = p.tone === 'no';
      return { src: p.src, name: p.name, op: heard || now ? 1 : 0.35, border: heard || now ? (no ? '#D9363E' : '#2E9E6B') : '#CAD6D6',
        fg: heard || now ? '#15262B' : '#8FA0A3', state: now ? '지금' : (heard ? (no ? '✕ 안 돼요' : '○ 괜찮아요') : ''),
        stateFg: now ? '#0F6670' : (no ? '#A3262C' : '#1D6E47') };
    });
    var p1done = st.maxLine >= 6, p2done = st.done;
    var lessons = [
      { label: '1교시 · 3일 전 피할 음식', state: part === 1 && st.started ? '지금' : (p1done ? '완료' : '') },
      { label: '2교시 · 드셔도 되는 음식', state: part === 2 && !p2done ? '지금' : (p2done ? '완료' : '') },
      { label: '3교시 · 전날 저녁', state: '사진 준비 중' }
    ].map(function (x) {
      var nowL = x.state === '지금';
      return { label: x.label, state: x.state, bg: nowL ? '#DCEDEE' : '#FFFFFF', bd: nowL ? '#0F6670' : '#CAD6D6', fg: nowL ? '#0B4E56' : '#4A5D63' };
    });
    var wave = !(st.cheer || st.done) && !st.quiz && (!st.started || cur.mode === 'intro');
    return Object.assign(flags, {
      isGrid: mode === 'intro' || mode === 'summary', isPhoto: st.started && mode === 'photo',
      gridTitle: mode === 'summary' ? (part === 1 ? '검사 3일 전부터 이 음식은 안 돼요' : '이 음식은 드셔도 돼요') : (part === 1 ? '오늘 배울 음식' : '드셔도 되는 음식'),
      thumbs: thumbs, photoName: photo ? photo.name : '',
      showX: !!photo && photo.tone === 'no', showO: !!photo && photo.tone === 'ok',
      pillText: photo && photo.tone === 'ok' ? '○ 드셔도 돼요' : '✕ 먹으면 안 돼요', pillBg: photo && photo.tone === 'ok' ? '#2E9E6B' : '#D9363E',
      subA: ki >= 0 ? sub.slice(0, ki) : sub, subKey: ki >= 0 ? key : '', subB: ki >= 0 ? sub.slice(ki + key.length) : '',
      keyBg: good ? '#DDF3E8' : '#FCE3E1', keyFg: good ? '#1D6E47' : '#A3262C',
      quiz: st.quiz, done: st.done,
      quizOpts: q.opts.map(function (o, i) { return { label: o, bg: st.wrong === i ? '#FCE3E1' : '#FFFFFF', pick: function () { self.answer(i); } }; }),
      poseCheer: st.cheer || st.done, poseWave: wave, posePoint: !(st.cheer || st.done) && !wave,
      faceNormal: !(st.cheer || st.done),
      bobAnim: on || st.cheer ? 'lcBob 1.8s ease-in-out infinite' : 'none',
      armAnim: on && !st.quiz ? (wave ? 'lcWave .9s ease-in-out infinite' : 'lcPoint 1.4s ease-in-out infinite') : 'none',
      talkAnim: on && !st.done ? 'lcTalk .32s steps(1, end) infinite' : 'none',
      showStart: !st.started, bars: bars, learned: learned, lessons: lessons,
      toggleLabel: on ? '일시정지' : '재생',
      play: function () { self.setState({ started: true, playing: true }); self.playLine(0); },
      toggle: function () {
        if (self.state.playing) { self.stopAll(); self.setState({ playing: false }); }
        else {
          self.setState({ started: true, playing: true });
          if (self.state.done) { self.reviewing = false; self.setState({ maxLine: 0 }); self.playLine(0); }
          else if (self.state.quiz) self.say(self.quizFor(self.partOf(self.state.line)).q, null, 0);
          else self.playLine(self.state.line);
        }
      },
      replay: function () { self.reviewing = false; self.setState({ playing: true, started: true, maxLine: 0 }); self.playLine(0); },
      prev: function () { self.reviewing = false; var n = Math.max(0, self.state.line - 1); if (self.state.playing) self.playLine(n); else { self.stopAll(); self.setState({ started: true, line: n, quiz: false, cheer: false, done: false }); } },
      next: function () { self.reviewing = false; var n = Math.min(L.length - 1, self.state.line + 1); if (self.state.playing) self.playLine(n); else { self.stopAll(); self.setState({ started: true, line: n, maxLine: Math.max(self.state.maxLine, n), quiz: false, cheer: false, done: false }); } }
    });
  }
}
</script>
